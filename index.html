/* ═══════════════════════ LESSON: PARETO OPTIMALITY ═══════════════════════ */
/* An interactive payoff-matrix checker (no submissions/Firebase). The instructor
   projects it and steps through the four-step test on each cell. */
const PARETO_PRESETS = {
  dilemma: { name:"Give or Keep (a dilemma)", rows:["A: Keep","A: Give"], cols:["B: Keep","B: Give"],
    cells:[[{a:2,b:2},{a:5,b:0}],[{a:0,b:5},{a:3,b:3}]],
    note:"The only dominated cell is (2, 2) — the Nash outcome where both Keep. Self-interest lands on the one outcome that is NOT Pareto optimal. Note (5, 0) and (0, 5) are Pareto optimal too — efficient need not be fair." },
  fair: { name:"Efficient ≠ fair", rows:["A: Plan X","A: Plan Y"], cols:["B: Plan X","B: Plan Y"],
    cells:[[{a:5,b:1},{a:0,b:0}],[{a:0,b:0},{a:1,b:5}]],
    note:"(5, 1) and (1, 5) are BOTH Pareto optimal, even though each is lopsided — Pareto optimality says nothing about fairness. Only the (0, 0) mismatches are dominated." },
  simple: { name:"One clear winner", rows:["A: Top","A: Bottom"], cols:["B: Left","B: Right"],
    cells:[[{a:4,b:4},{a:3,b:2}],[{a:2,b:3},{a:1,b:1}]],
    note:"Only (4, 4) survives — it beats every other cell for both players. The rest are all dominated." }
};
let PZ=null;
function paretoInit(key){
  const p=PARETO_PRESETS[key];
  PZ={ preset:key, rows:p.rows.slice(), cols:p.cols.slice(),
       cells:p.cells.map(row=>row.map(c=>({a:c.a,b:c.b}))), sel:null, step:1, checkedAll:false, edit:false };
}
/* y dominates x: at least as good for both, strictly better for someone. */
function pDom(x,y){ return y.a>=x.a && y.b>=x.b && (y.a>x.a || y.b>x.b); }
function paretoStatuses(cells){
  const flat=[]; for(let r=0;r<cells.length;r++) for(let c=0;c<cells[r].length;c++) flat.push({r,c,a:cells[r][c].a,b:cells[r][c].b});
  return flat.map(x=>{ const doms=flat.filter(y=>!(y.r===x.r&&y.c===x.c)&&pDom(x,y)); return {r:x.r,c:x.c,a:x.a,b:x.b,dominated:doms.length>0,doms}; });
}
function pStatAt(stats,r,c){ return stats.find(s=>s.r===r&&s.c===c); }
function cellName(r,c){ return "("+PZ.rows[r].replace(/^[AB]: /,"")+", "+PZ.cols[c].replace(/^[AB]: /,"")+")"; }
function paretoLesson(){
  if(!PZ) paretoInit("dilemma");
  const stats=paretoStatuses(PZ.cells);
  const wrap=el("div","lesson");
  const head=el("div","lesson-head");
  head.append(el("div","lesson-eyebrow","Interactive lesson"), el("div","lesson-title","Pareto optimality"),
    Object.assign(el("div","sm mut"),{textContent:"Player A picks the row, Player B the column. Each cell shows (A's payoff, B's payoff).",style:"margin-top:2px"}));
  wrap.append(head);

  const bodyEl=el("div","lesson-body");
  // ── matrix ──
  const left=el("div","lesson-left");
  const tbl=el("table","pmatrix");
  const hr=el("tr"); hr.append(el("th","corner"));
  PZ.cols.forEach(cl=> hr.append(Object.assign(el("th","collab"),{textContent:cl}))); tbl.append(hr);
  PZ.cells.forEach((row,r)=>{
    const tr=el("tr"); tr.append(Object.assign(el("th","collab"),{textContent:PZ.rows[r]}));
    row.forEach((cell,c)=>{
      const td=el("td","pcell"); const st=pStatAt(stats,r,c);
      const isCand = PZ.sel && PZ.sel.r===r && PZ.sel.c===c;
      const candStat = PZ.sel ? pStatAt(stats,PZ.sel.r,PZ.sel.c) : null;
      const isBetter = !PZ.checkedAll && PZ.sel && PZ.step>=2 && candStat && candStat.doms.some(d=>d.r===r&&d.c===c);
      if(isCand) td.classList.add("cand");
      if(isBetter) td.classList.add("better");
      // verdict styling: on Check-all for every cell, or on step 3 for the candidate only
      const showVerdict = PZ.checkedAll || (isCand && PZ.step>=3);
      if(showVerdict){ td.classList.add(st.dominated?"dominated":"optimal"); td.append(Object.assign(el("span","stamp"),{textContent:st.dominated?"dominated":"optimal ✓"})); }
      if(PZ.edit){
        const box=el("div"); box.style.display="flex"; box.style.gap="4px"; box.style.justifyContent="center"; box.style.alignItems="center";
        const ia=el("input"); ia.type="number"; ia.value=cell.a; ia.onchange=()=>{ PZ.cells[r][c].a=Number(ia.value)||0; PZ.checkedAll=false; render(); };
        const ib=el("input"); ib.type="number"; ib.value=cell.b; ib.onchange=()=>{ PZ.cells[r][c].b=Number(ib.value)||0; PZ.checkedAll=false; render(); };
        box.append(ia, document.createTextNode(","), ib); td.append(box);
      } else {
        const pay=el("div","pay"); pay.innerHTML="<span class='pa'>"+cell.a+"</span>, <span class='pb'>"+cell.b+"</span>";
        td.append(pay, Object.assign(el("div","plabel"),{textContent:"A, B"}));
        td.onclick=()=>{ PZ.sel={r,c}; PZ.step=1; PZ.checkedAll=false; render(); };
      }
      tr.append(td);
    });
    tbl.append(tr);
  });
  left.append(tbl);
  left.append(paretoMiniMap(stats));
  bodyEl.append(left);

  // ── step / verdict panel ──
  const right=el("div","lesson-right");
  const step=el("div","pstep");
  if(PZ.edit){
    step.append(Object.assign(el("h4"),{textContent:"Edit payoffs"}),
      Object.assign(el("div","pstep-txt"),{textContent:"Type any numbers into the cells (A's payoff, B's payoff). Then turn editing off and test the outcomes."}));
  } else if(PZ.checkedAll){
    const opt=stats.filter(s=>!s.dominated).map(s=>cellName(s.r,s.c));
    const dom=stats.filter(s=>s.dominated).map(s=>cellName(s.r,s.c));
    step.append(Object.assign(el("h4"),{textContent:"All cells checked"}));
    const t=el("div","pstep-txt");
    t.innerHTML="<b>Pareto optimal (circled):</b> "+esc(opt.join("  ·  ")||"none")+".<br><b>Dominated:</b> "+esc(dom.join("  ·  ")||"none")+".";
    step.append(t);
    step.append(Object.assign(el("div","sm mut"),{textContent:PARETO_PRESETS[PZ.preset]?PARETO_PRESETS[PZ.preset].note:"",style:"margin-top:8px"}));
  } else if(PZ.sel){
    const cs=pStatAt(stats,PZ.sel.r,PZ.sel.c);
    step.append(Object.assign(el("h4"),{textContent:"Step "+PZ.step+" of 3"}));
    const t=el("div","pstep-txt");
    if(PZ.step===1){
      t.innerHTML="<b>Examine this cell.</b> You picked <b>"+esc(cellName(PZ.sel.r,PZ.sel.c))+"</b> — payoffs <b>("+cs.a+", "+cs.b+")</b>. Is it Pareto optimal? Press <b>Next</b> to scan the other cells.";
    } else if(PZ.step===2){
      const nb=cs.doms.length;
      t.innerHTML="<b>Scan for complete improvements.</b> Look at every other cell: is there one where <i>both</i> payoffs are ≥ and <i>at least one</i> is strictly higher? "+(nb?("<b>"+nb+"</b> such cell"+(nb>1?"s are":" is")+" shaded green."):"<b>None</b> found.")+" Press <b>Next</b> for the verdict.";
    } else {
      if(cs.dominated){
        const d=cs.doms[0];
        t.innerHTML="<div class='verdict no'>Dominated — NOT Pareto optimal.</div>Moving to <b>"+esc(cellName(d.r,d.c))+"</b> = ("+d.a+", "+d.b+") makes "+improveWho(cs,d)+" — nobody worse off. A Pareto improvement exists, so this cell fails the test.";
      } else {
        t.innerHTML="<div class='verdict yes'>Pareto optimal ✓</div>No other cell beats or ties it for <i>both</i> players. You can't make one player better off without making the other worse off — so we circle it.";
      }
    }
    step.append(t);
  } else {
    step.append(Object.assign(el("h4"),{textContent:"How to test an outcome"}),
      Object.assign(el("div","pstep-txt"),{textContent:"Tap any cell to check it step by step, or press “Check all” to reveal every Pareto-optimal outcome at once."}));
  }
  right.append(step);

  // step nav (when a cell is selected and not in check-all/edit)
  if(PZ.sel && !PZ.checkedAll && !PZ.edit){
    const nav=el("div","lesson-ctr");
    const back=el("button","ghost-btn","‹ Back"); back.onclick=()=>{ if(PZ.step>1)PZ.step--; render(); }; if(PZ.step<=1) back.disabled=true;
    const nx=el("button","btn","Next ›"); nx.onclick=()=>{ if(PZ.step<3)PZ.step++; render(); }; if(PZ.step>=3) nx.disabled=true;
    nav.append(back,nx); right.append(nav);
  }
  bodyEl.append(right);
  wrap.append(bodyEl);

  // ── bottom controls ──
  const ctr=el("div","lesson-ctr");
  const checkAll=el("button","btn gold",PZ.checkedAll?"Clear marks":"Check all"); checkAll.onclick=()=>{ PZ.checkedAll=!PZ.checkedAll; PZ.sel=null; render(); };
  const editB=el("button","ghost-btn"+(PZ.edit?" on":""),PZ.edit?"Done editing":"Edit values"); editB.onclick=()=>{ PZ.edit=!PZ.edit; PZ.sel=null; PZ.checkedAll=false; render(); };

  const exit=el("button","ghost-btn","Exit lesson"); exit.onclick=()=>{ lessonMode=null; render(); };
  ctr.append(checkAll,editB,reset,exit);
  wrap.append(ctr);

  // preset row
  const pr=el("div","pset-row");

  Object.keys(PARETO_PRESETS).forEach(k=>{ const b=el("button","ghost-btn"+(PZ.preset===k&&!PZ.edit?" on":""),PARETO_PRESETS[k].name);
    b.onclick=()=>{ paretoInit(k); render(); }; pr.append(b); });
  wrap.append(pr);
  return wrap;
}
function improveWho(cand,dom){
  const aUp=dom.a>cand.a, bUp=dom.b>cand.b;
  if(aUp&&bUp) return "<b>both players</b> better off";
  if(aUp) return "<b>Player A</b> better off (B unchanged)";
  return "<b>Player B</b> better off (A unchanged)";
}
/* Small payoff-space companion: each cell as a dot (x=A, y=B); circled if Pareto optimal
   once verdicts are shown. Reinforces "the optimal cells form the frontier". */
function paretoMiniMap(stats){
  const W=220,H=150,pad=26; const xs=stats.map(s=>s.a),ys=stats.map(s=>s.b);
  const xmax=Math.max(1,...xs), ymax=Math.max(1,...ys);
  const sx=a=>pad+(W-2*pad)*(a/xmax), sy=b=>H-pad-(H-2*pad)*(b/ymax);
  const show = PZ.checkedAll || (PZ.sel && PZ.step>=3);
  let dots="";
  stats.forEach(s=>{
    const cx=sx(s.a).toFixed(1), cy=sy(s.b).toFixed(1);
    const isCand=PZ.sel&&PZ.sel.r===s.r&&PZ.sel.c===s.c;
    const opt = show && !s.dominated;
    const fill = opt?"var(--good)":(show&&s.dominated?"var(--bad)":"var(--muted)");
    if(opt) dots+='<circle cx="'+cx+'" cy="'+cy+'" r="9" fill="none" stroke="var(--good)" stroke-width="2"/>';
    dots+='<circle cx="'+cx+'" cy="'+cy+'" r="5" fill="'+fill+'"'+(isCand?' stroke="var(--ink)" stroke-width="2"':'')+'/>';
  });
  const svg='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="payoff space">'
    +'<line x1="'+pad+'" y1="'+(H-pad)+'" x2="'+(W-pad)+'" y2="'+(H-pad)+'" stroke="var(--line)"/>'
    +'<line x1="'+pad+'" y1="'+pad+'" x2="'+pad+'" y2="'+(H-pad)+'" stroke="var(--line)"/>'
    +'<text x="'+(W/2)+'" y="'+(H-4)+'" text-anchor="middle" font-size="9" fill="var(--muted)">Player A payoff →</text>'
    +'<text x="10" y="'+(H/2)+'" text-anchor="middle" font-size="9" fill="var(--muted)" transform="rotate(-90 10 '+(H/2)+')">Player B payoff →</text>'
    +dots+'</svg>';
  const box=el("div","pminimap"); box.innerHTML=svg; return box;
}

/* Export EVERY submission in this room (all sessions/games/rounds) as CSV for offline
   analysis and long-term retention. Reads allSubs, so it spans the whole class. */
function exportCSV(){
  const rows=Object.values(allSubs).filter(Boolean).sort((a,b)=>(a.ts||0)-(b.ts||0));
  const head=["room","session","game","round","roundKey","email","name","id","area","section","enrolled","response","timestamp"];
  const out=[head.join(",")];
  rows.forEach(s=>{
    const email=subEmail(s); const enrolled = email && roster[email.toLowerCase()] ? "yes" : "no";
    const resp = subValue(s);
    out.push([ROOM, (s.session!=null?"S"+s.session:""), s.game||"", (s.round!=null?s.round:""), s.roundKey||"", email, s.name||"", s.sid||"", s.area||"", secOf(s), enrolled, resp, (s.ts?new Date(s.ts).toISOString():"")].map(csvCell).join(","));
  });
  try{
    const blob=new Blob([out.join("\r\n")],{type:"text/csv;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=ROOM+"-submissions-"+new Date().toISOString().slice(0,10)+".csv";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1500);
    toast(rows.length+" rows exported");
  }catch(e){ toast("Export failed"); }
}

function subValue(s){
  if(s.game==="pd") return s.choice==="keep"?"Keep":"Give";
  if(s.game==="publicgoods") return s.contrib!=null?String(s.contrib):"—";
  if(s.game==="coord") return coordVal(s);
  if(s.game==="redblack"){ const seq=rbSeq(s); return (s.color==="red"?"Red":s.color==="black"?"Black":"?")+" ["+seq.join(" ")+"] vs "+(s.partnerName||"?"); }
  if(s.game==="quatro"){ try{ return JSON.parse(s.piles||"[]").join(" ")+" vs "+(s.partnerName||"?"); }catch(e){ return "—"; } }

function renderSdkError(){
  setupPill("Offline");
  const c=el("div","card stage"); c.append(el("div","eyebrow gold","Can't load Firebase"),
    Object.assign(el("h2"),{textContent:"The Firebase library didn't load",style:"font-size:1.4rem;margin:6px 0 8px"}),
    Object.assign(el("p","lead"),{textContent:"This page needs internet access to reach Google's Firebase CDN. Check the connection and reload. If you're opening the file directly from disk, host it (e.g. Netlify Drop) instead."}));
  $("#app").replaceChildren(c);
}
function renderRulesError(){
  setupPill("Permission error");
  const c=el("div","card stage"); c.append(el("div","eyebrow gold","Database blocked the request"),
    Object.assign(el("h2"),{textContent:"Check your Realtime Database rules",style:"font-size:1.4rem;margin:6px 0 8px"}),
    Object.assign(el("p","lead"),{textContent:"Firebase is connected but refused read/write — usually because the database is still in locked mode. In Realtime Database → Rules, set both .read and .write to true and Publish, then reload."}));
  $("#app").replaceChildren(c);
}
</script>
