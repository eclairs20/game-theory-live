<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Theory Live</title>
<meta name="description" content="A live classroom instrument for game-theory exercises.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://securetoken.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EDF1F6; --surface:#FFFFFF; --surface-2:#F5F8FC; --raised:#FFFFFF;
  --ink:#17222F; --ink-2:#39485A; --muted:#66788C; --faint:#93A3B5;
  --line:#D9E1EB; --line-2:#E7EDF4;
  --accent:#0E7A6E; --accent-ink:#0B5B52; --accent-wash:#E1F1EE;
  --gold:#A8710F; --gold-wash:#F6ECD8;
  --good:#2C7A54; --good-wash:#E2F0E7;
  --bad:#BB4632; --bad-wash:#F6E4DF;
  --warn:#B67A12;
  --shadow:0 1px 2px rgba(20,35,55,.06),0 6px 20px rgba(20,35,55,.07);
  --shadow-lg:0 2px 6px rgba(20,35,55,.08),0 18px 46px rgba(20,35,55,.13);
  --radius:14px; --radius-sm:9px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C131C; --surface:#131E2A; --surface-2:#182634; --raised:#1B2836;
    --ink:#E9EFF6; --ink-2:#B9C7D6; --muted:#8598AB; --faint:#5E7085;
    --line:#26333F; --line-2:#213040;
    --accent:#3BB9A9; --accent-ink:#8FE0D4; --accent-wash:#123029;
    --gold:#D6A548; --gold-wash:#2E2415;
    --good:#4FB483; --good-wash:#16301F; --bad:#DE7A66; --bad-wash:#331A15; --warn:#D8A23E;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.4);
    --shadow-lg:0 2px 8px rgba(0,0,0,.5),0 22px 50px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0C131C; --surface:#131E2A; --surface-2:#182634; --raised:#1B2836;
  --ink:#E9EFF6; --ink-2:#B9C7D6; --muted:#8598AB; --faint:#5E7085;
  --line:#26333F; --line-2:#213040;
  --accent:#3BB9A9; --accent-ink:#8FE0D4; --accent-wash:#123029;
  --gold:#D6A548; --gold-wash:#2E2415;
  --good:#4FB483; --good-wash:#16301F; --bad:#DE7A66; --bad-wash:#331A15; --warn:#D8A23E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.4);
  --shadow-lg:0 2px 8px rgba(0,0,0,.5),0 22px 50px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
img{max-width:100%}
h1,h2,h3{font-family:"Fraunces",Georgia,serif; font-weight:600; text-wrap:balance; margin:0; letter-spacing:-.01em; color:var(--ink)}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace; font-variant-numeric:tabular-nums}
button{font-family:inherit; cursor:pointer}
input,select{font-family:inherit; font-size:1rem}
a{color:var(--accent-ink)}
code{font-family:"IBM Plex Mono",monospace; background:var(--surface-2); padding:1px 5px; border-radius:5px; font-size:.85em; border:1px solid var(--line)}

.shell{max-width:1120px; margin:0 auto; padding:20px clamp(14px,3vw,30px) 72px}
.topbar{display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding:14px 4px 20px}
.brand{display:flex; align-items:center; gap:12px; margin-right:auto}
.brand .glyph{width:38px;height:38px;border-radius:10px;background:
  radial-gradient(circle at 30% 28%,var(--accent) 0 42%,transparent 44%),
  radial-gradient(circle at 72% 74%,var(--gold) 0 34%,transparent 36%),
  var(--surface); border:1px solid var(--line); box-shadow:var(--shadow); flex:none}
.brand h1{font-size:1.32rem}
.brand .sub{font-size:.72rem; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); font-weight:600}
.pill{display:inline-flex; align-items:center; gap:7px; padding:6px 12px; border-radius:999px; font-size:.78rem; font-weight:600; border:1px solid var(--line); background:var(--surface); color:var(--ink-2); white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.pill.live{color:var(--good); border-color:color-mix(in srgb,var(--good) 40%,var(--line))}
.pill.live .dot{background:var(--good); box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent); animation:pulse 2s infinite}
.pill.wait{color:var(--warn)}
.pill.reveal{color:var(--gold); border-color:color-mix(in srgb,var(--gold) 40%,var(--line))}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}

.ghost-btn{background:var(--surface); border:1px solid var(--line); color:var(--ink-2); padding:8px 14px; border-radius:var(--radius-sm); font-weight:600; font-size:.85rem; transition:.15s}
.ghost-btn:hover{border-color:var(--accent); color:var(--accent-ink)}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
.stage{padding:clamp(20px,3.4vw,40px)}
.eyebrow{font-size:.74rem; letter-spacing:.14em; text-transform:uppercase; color:var(--accent-ink); font-weight:600}
.eyebrow.gold{color:var(--gold)}
.lead{color:var(--ink-2); font-size:1.02rem; max-width:60ch}

.field{display:flex; flex-direction:column; gap:6px}
.field label{font-size:.8rem; font-weight:600; color:var(--muted); letter-spacing:.02em}
.input{width:100%; padding:11px 13px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--surface-2); color:var(--ink); transition:.15s}
.input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-wash)}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 20px; border-radius:var(--radius-sm); border:1px solid transparent; background:var(--accent); color:#fff; font-weight:600; font-size:.95rem; transition:.15s; box-shadow:var(--shadow)}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5; cursor:not-allowed; filter:none}
.btn.gold{background:var(--gold)}
.btn.neutral{background:var(--surface); color:var(--ink); border-color:var(--line)}
.btn.neutral:hover{border-color:var(--accent)}
.btn.big{padding:15px 26px; font-size:1.05rem}
.btn.wide{width:100%}

.choices{display:grid; gap:14px}
.choice{position:relative; text-align:left; padding:18px 18px 16px; border-radius:var(--radius); border:1.5px solid var(--line); background:var(--surface-2); transition:.16s; display:flex; flex-direction:column; gap:5px}
.choice:hover{border-color:var(--accent); transform:translateY(-1px)}
.choice.sel{border-color:var(--accent); background:var(--accent-wash); box-shadow:0 0 0 3px var(--accent-wash)}
.choice.sel.coop{border-color:var(--good); background:var(--good-wash); box-shadow:0 0 0 3px var(--good-wash)}
.choice.sel.defect{border-color:var(--bad); background:var(--bad-wash); box-shadow:0 0 0 3px var(--bad-wash)}
.choice .ttl{font-weight:700; font-size:1.06rem; color:var(--ink)}
.choice .desc{font-size:.86rem; color:var(--muted)}
.choice .tag{position:absolute; top:14px; right:14px; font-size:.68rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}

.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px; background:var(--line-2); border-radius:var(--radius); overflow:hidden; border:1px solid var(--line)}
.stat{background:var(--surface); padding:16px 18px; display:flex; flex-direction:column; gap:3px}
.stat .k{font-size:.74rem; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); font-weight:600}
.stat .v{font-size:1.7rem; font-weight:600; font-family:"Fraunces",serif; letter-spacing:-.02em; line-height:1.05}
.stat .v.mono{font-family:"IBM Plex Mono",monospace; font-size:1.5rem}
.stat .note{font-size:.76rem; color:var(--faint)}
.stat.hl .v{color:var(--gold)}
.stat.good .v{color:var(--good)} .stat.bad .v{color:var(--bad)}

.grid2{display:grid; grid-template-columns:1fr 1fr; gap:18px}
.grid-analysis{display:grid; grid-template-columns:1.15fr .85fr; gap:20px; align-items:start}
@media(max-width:800px){.grid2,.grid-analysis{grid-template-columns:1fr}}

.chart-card{background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius); padding:18px}
.chart-card h3{font-size:1rem; margin-bottom:4px}
.chart-card .cap{font-size:.8rem; color:var(--muted); margin-bottom:12px}
svg{display:block; width:100%; height:auto; overflow:visible}

.note-box{border-left:3px solid var(--gold); background:var(--gold-wash); padding:12px 16px; border-radius:0 var(--radius-sm) var(--radius-sm) 0; font-size:.9rem; color:var(--ink-2)}
.note-box.teal{border-color:var(--accent); background:var(--accent-wash)}
.note-box b{color:var(--ink)}

.matrix{border-collapse:separate; border-spacing:0; width:100%; font-size:.9rem}
.matrix td,.matrix th{border:1px solid var(--line); padding:12px 10px; text-align:center}
.matrix th{background:var(--surface-2); color:var(--muted); font-weight:600; font-size:.78rem; letter-spacing:.03em}
.matrix .cell{font-family:"IBM Plex Mono",monospace; font-weight:500}
.matrix .nash{background:var(--bad-wash)} .matrix .pareto{background:var(--good-wash)}
.matrix .played{outline:2px solid var(--accent); outline-offset:-2px}

.console{display:grid; grid-template-columns:290px 1fr; gap:20px; align-items:start}
@media(max-width:820px){.console{grid-template-columns:1fr}}
.rail{position:sticky; top:16px; display:flex; flex-direction:column; gap:14px}
.rail-sec{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow)}
.rail-sec h3{font-size:.8rem; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); font-weight:600; margin-bottom:12px}
.game-pick{display:flex; flex-direction:column; gap:8px}
.gp{display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--surface-2); text-align:left; transition:.14s; width:100%}
.gp:hover{border-color:var(--accent)}
.gp.on{border-color:var(--accent); background:var(--accent-wash)}
.gp .n{font-weight:600; font-size:.9rem; color:var(--ink)}
.gp .d{font-size:.74rem; color:var(--muted)}
.gp .ic{width:26px;height:26px;flex:none;border-radius:7px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:.8rem;color:var(--accent-ink)}
.rowbtns{display:flex; gap:8px; flex-wrap:wrap}
.seg{display:flex; align-items:center; gap:8px}
.count-big{font-family:"Fraunces",serif; font-size:2.4rem; font-weight:600; line-height:1}

.tinylabel{font-size:.76rem; color:var(--muted); font-weight:600}
.center{text-align:center}
.stack{display:flex; flex-direction:column; gap:16px}
.row{display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.spread{justify-content:space-between}
.divider{height:1px; background:var(--line-2); margin:4px 0}
.mut{color:var(--muted)} .sm{font-size:.85rem}

.setup-wrap{max-width:640px; margin:4vh auto 0}
.paramgrid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:.78rem; color:var(--muted); margin-top:10px}
.legc{display:inline-flex; align-items:center; gap:6px}
.swatch{width:11px;height:11px;border-radius:3px}
.steps{counter-reset:s; display:flex; flex-direction:column; gap:14px; margin-top:8px}
.step{display:flex; gap:12px}
.step .num{counter-increment:s; flex:none; width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.85rem}
.step .num::before{content:counter(s)}
.step .body{font-size:.92rem; color:var(--ink-2); padding-top:2px}
.step .body b{color:var(--ink)}

.toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--bg); padding:11px 20px; border-radius:999px; font-size:.88rem; font-weight:500; box-shadow:var(--shadow-lg); opacity:0; transition:.25s; pointer-events:none; z-index:50}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
.badge{font-size:.7rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:3px 8px; border-radius:6px; background:var(--accent-wash); color:var(--accent-ink)}
.myval{font-family:"IBM Plex Mono",monospace; font-weight:600; color:var(--accent-ink)}
textarea.input{resize:vertical; min-height:96px; line-height:1.45; width:100%}
.gbtn{display:inline-flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:12px 18px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--surface); color:var(--ink); font-weight:600; font-size:.95rem; transition:.15s; box-shadow:var(--shadow)}
.gbtn:hover{border-color:var(--accent)}
.gbtn .g{width:18px;height:18px;flex:none}
.orline{display:flex; align-items:center; gap:12px; color:var(--faint); font-size:.78rem; margin:16px 0; text-transform:uppercase; letter-spacing:.1em}
.orline::before,.orline::after{content:""; height:1px; background:var(--line); flex:1}
.chips{display:flex; flex-wrap:wrap; gap:7px}
.chip{font-size:.8rem; font-weight:600; padding:4px 10px; border-radius:999px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); display:inline-flex; align-items:center; gap:6px}
.chip.done{color:var(--good); border-color:color-mix(in srgb,var(--good) 40%,var(--line)); background:var(--good-wash)}
.chip.todo{color:var(--muted)}
.chip.guest{color:var(--gold); border-color:color-mix(in srgb,var(--gold) 45%,var(--line)); background:var(--gold-wash)}
.pickprompt{font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:1.15rem; color:var(--ink); margin:22px 0 12px}
.picks{display:grid; grid-template-columns:1fr 1fr; gap:14px}
@media(max-width:520px){.picks{grid-template-columns:1fr}}
.pick{position:relative; text-align:left; padding:20px 18px 16px; border-radius:var(--radius); border:2px solid var(--line); background:var(--surface-2); transition:.16s; display:flex; flex-direction:column; gap:6px}
.pick .ttl{font-weight:800; font-size:1.25rem; color:var(--ink)}
.pick .desc{font-size:.86rem; color:var(--muted)}
.pick .tag{position:absolute; top:14px; right:14px; font-size:.66rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; opacity:.85}
.pick:hover{transform:translateY(-2px); box-shadow:var(--shadow-lg)}
.pick:active{transform:translateY(0)}
.pick.teal{border-color:var(--accent); background:var(--accent-wash)} .pick.teal .ttl{color:var(--accent-ink)}
.pick.gold{border-color:var(--gold); background:var(--gold-wash)} .pick.gold .ttl{color:var(--gold)}
.pick.teal.sel{background:var(--accent); border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-wash)}
.pick.gold.sel{background:var(--gold); border-color:var(--gold); box-shadow:0 0 0 3px var(--gold-wash)}
.pick.sel .ttl,.pick.sel .desc,.pick.sel .tag{color:#fff; opacity:1}
.footer{text-align:center; color:var(--faint); font-size:.78rem; line-height:1.5; padding:30px 12px 0}
.footer b{color:var(--muted); font-weight:600}
.submail{font-size:.72rem; color:var(--muted); font-family:"IBM Plex Mono",monospace; margin-top:2px; word-break:break-all; font-weight:400}
.whowrap{display:flex; flex-wrap:wrap; gap:8px}
.who{border:1px solid var(--line); background:var(--surface-2); border-radius:10px; padding:7px 11px 8px; min-width:0}
.who-name{font-weight:600; font-size:.85rem; color:var(--ink-2)}
.who-mail{font-size:.72rem; color:var(--muted); font-family:"IBM Plex Mono",monospace; margin-top:1px; word-break:break-all}
.who.done{border-color:color-mix(in srgb,var(--good) 40%,var(--line)); background:var(--good-wash)} .who.done .who-name{color:var(--good)}
.who.todo .who-name{color:var(--muted)}
.who.guest{border-color:color-mix(in srgb,var(--gold) 45%,var(--line)); background:var(--gold-wash)} .who.guest .who-name{color:var(--gold)}
</style>
</head>
<body>

<div class="shell">
  <div class="topbar">
    <div class="brand">
      <div class="glyph" aria-hidden="true"></div>
      <div>
        <h1>Game Theory Live</h1>
        <div class="sub" id="brandSub">Strategic Interaction Lab</div>
      </div>
    </div>
    <span id="phasePill" class="pill"><span class="dot"></span><span id="phaseTxt">Connecting…</span></span>
    <button id="roleBtn" class="ghost-btn">Instructor</button>
    <button id="themeBtn" class="ghost-btn" title="Toggle theme">◐</button>
  </div>
  <div id="app"><div class="card stage center" style="padding:60px"><div class="mut">Loading the session…</div></div></div>
  <footer class="footer">A <b>Strategic Interaction Lab</b> instrument · designed by <b>Prof. Sonia</b>, IIM Lucknow</footer>
</div>
<div id="toast" class="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   ①  PASTE YOUR FIREBASE CONFIG HERE  (see the setup screen for the 4 steps)
   Create a free Firebase project → Realtime Database → Web app → copy config.
   Replace the placeholder strings below. databaseURL is REQUIRED.
   ═══════════════════════════════════════════════════════════════════════ */
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyC1J9sykoM6vBFIkJR72thwYWPIuBK3xRU",
  authDomain:        "game-theory-live.firebaseapp.com",
  databaseURL:       "https://game-theory-live-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "game-theory-live",
  storageBucket:     "game-theory-live.firebasestorage.app",
  messagingSenderId: "447949075164",
  appId:             "1:447949075164:web:c947337267ad975ef4fa19"
};
/* One room per class (course + year), e.g. "pgp-2026". It comes from the ?class=
   URL parameter, so different cohorts run from different share links with no code
   change. Defaults to "main" (the original room) when no ?class is given, so old
   links keep working. All of a class's sessions, roster and data live under it. */
/* The class/course id from ?class=<id>. A bare link (no param) falls back to "main"
   and, for signed-in students, triggers enrollment-based auto-routing to their course. */
const CLASS_PARAM = (function(){
  try{ const p=new URLSearchParams(location.search).get("class"); if(p){ const c=p.replace(/[^A-Za-z0-9_-]/g,"").slice(0,60); if(c) return c; } }catch(e){}
  return null;
})();
const ROOM = CLASS_PARAM || "main";
const HAS_CLASS_PARAM = CLASS_PARAM != null;

/* Instructor allowlist. Any Google account whose email is listed here gets the
   console straight away on sign-in — no passcode. Add EVERY instructor's Google
   address BEFORE publishing the strict Firebase rules, or they'll be locked out
   of their own class. */
const INSTRUCTOR_EMAILS = [
  "ankit.khandelwal@gmail.com",
  "sonia@iiml.ac.in"
];
/* Flip to true ONLY after the strict rules (see firebase-rules.lockdown.json) are
   published AND Google sign-in is confirmed working. It makes student joining
   Google-only (no anonymous name-join) and instructor access allowlist-only
   (no passcode) — matching what the strict rules enforce on the server. */
const REQUIRE_GOOGLE = true;
const isInstructorEmail = e => !!e && INSTRUCTOR_EMAILS.some(x=>x.toLowerCase()===String(e).toLowerCase());
/* ═══════════════════════════════════════════════════════════════════════ */

/* Instructor-panel order follows the key order here: Give or Keep (G1) first. */
const GAMES = {
  pd: { name:"Give or Keep", short:"G1", icon:"G1",
    blurb:"Keep money for yourself, or give more to your partner." },
  guess23: { name:"Guess ½ of the Average", short:"G2", icon:"G2",
    blurb:"Pick a number; target is a fraction of the class mean." },
  publicgoods: { name:"Public Goods", short:"G3", icon:"G3",
    blurb:"Contribute to a shared fund that pays everyone." }
};
const DEFAULT_CONFIG = {
  guess23:{ frac:1/2, min:0, max:100, step:0.5 },
  pd:{ keep:2, give:3 },
  publicgoods:{ E:20, mpcr:0.5 }
};

const $ = s => document.querySelector(s);
const el = (t,c,txt)=>{const e=document.createElement(t); if(c)e.className=c; if(txt!=null)e.textContent=txt; return e;};
const fmt = (n,d=1)=> (n==null||isNaN(n))?"—":Number(n).toLocaleString(undefined,{maximumFractionDigits:d,minimumFractionDigits:0});
const pct = n => (n==null||isNaN(n))?"—":Math.round(n*100)+"%";
function hash(str){let h=5381; for(let i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))>>>0; return h.toString(36);}
function toast(m){const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2200);}
function ls(k,v){try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){ return null; }}

/* Identity: a student is either signed in with Google (authUser) or joined
   manually with a typed name (manualId + gtl_name). `myId`/`myName` are the
   *effective* identity, recomputed by applyIdentity() on every render. */
let manualId = ls("gtl_id");
if(!manualId){ manualId = "s_"+Math.random().toString(36).slice(2,9); ls("gtl_id",manualId); }
let myId = manualId;
let myName = ls("gtl_name") || "";
let meGuest = false;
/* Firebase keys can't contain . # $ [ ] / — percent-encode them so an email
   works as a path segment. Random ids and roll numbers pass through unchanged. */
function encodeKey(s){ return String(s).replace(/[.#$\[\]\/]/g, c=>"%"+c.charCodeAt(0).toString(16)); }

(function initTheme(){
  const saved = ls("gtl_theme");
  if(saved) document.documentElement.setAttribute("data-theme",saved);
  $("#themeBtn").onclick=()=>{
    const cur = document.documentElement.getAttribute("data-theme");
    const isDark = cur ? cur==="dark" : matchMedia("(prefers-color-scheme:dark)").matches;
    const next = isDark?"light":"dark";
    document.documentElement.setAttribute("data-theme",next); ls("gtl_theme",next);
  };
})();

/* ═══════════════════════ state + data layer (Firebase) ═══════════════════════ */
let fb=null, fbAuth=null, authUser=null, control=null, controlLoaded=false, allSubs={}, subs=[], curKey=null;
let roster={}, rosterList=[];
let courses={}, enroll={}, routed=false;   // global course registry + per-email enrollment index
let authResolved=false, listenersOn=false, authSlow=false;
let role = ls("gtl_role")==="teacher" ? "teacher" : "student";
let unlocked = ls("gtl_role")==="teacher";

/* A record's key is scoped by session so replaying a game in a later session never
   overwrites an earlier one: "S3-pd-1__email". Everything under one room is retained. */
const curSession = ()=> (control&&control.session)||1;
const curMSection = ()=> ((control&&control.section)||"").toUpperCase();   // section currently running ("" = none)
const roundKey = (g,r)=> "S"+curSession()+curMSection()+"-"+g+"-"+r;         // e.g. "S1A-pd-1" or "S1-pd-1"
const CTRL_PATH = ()=> ROOM+"/control";
const SUBS_PATH = ()=> ROOM+"/subs";
const ROSTER_PATH = ()=> ROOM+"/roster";
const SUB_DOC = (key,sid)=> SUBS_PATH()+"/"+key+"__"+encodeKey(sid);
const COURSES_PATH = "courses";                              // global: courses/<id> = {name, createdAt}
const ENROLL_DOC = email => "enroll/"+encodeKey(String(email).toLowerCase());   // enroll/<email> = {<courseId>:true}
const haveRoster = ()=> rosterList.length>0;
function setRoster(val){
  rosterList=[]; roster={};
  if(val){ (Array.isArray(val)?val:Object.values(val)).forEach(e=>{
    if(!e||!e.email) return; const em=String(e.email).toLowerCase().trim(); if(!em) return;
    const entry={ email:em, name:(e.name&&String(e.name).trim())||em,
      sid:(e.sid&&String(e.sid).trim())||"", area:(e.area&&String(e.area).trim())||"",
      section:(e.section?String(e.section).trim().toUpperCase():"") };
    roster[em]=entry; rosterList.push(entry);
  }); }
}
function rosterSections(){ const s={}; rosterList.forEach(e=>{ if(e.section) s[e.section]=1; }); return Object.keys(s).sort(); }
/* A submission's home section: denormalized on the doc, else looked up from the roster. */
function secOf(s){ return (s.section || (roster[String(s.studentId||"").toLowerCase()]||{}).section || "").toUpperCase(); }
/* Instructor analysis scope by MEETING section. null = follow the running section;
   "A"/"B" = that section's meeting; "BOTH" = combine both for this session+game+round. */
let sectionScope=null;
function effScope(){ return sectionScope!=null ? sectionScope : curMSection(); }
function analysisSubs(){
  const sc=effScope(), s=curSession(), g=control&&control.activeGame, r=control&&control.round;
  return Object.values(allSubs).filter(x=> x && x.session===s && x.game===g && x.round===r
    && (sc==="BOTH" || String(x.msection||"").toUpperCase()===sc));
}
/* Resolve the effective identity from Google auth (if signed in) or the manual name. */
function applyIdentity(){
  if(authUser){
    const email=(authUser.email||"").toLowerCase();
    const rn=roster[email];
    myId=email; myName=(rn&&rn.name)||authUser.displayName||email;
    meGuest = !rn;                       // enrolled only if the email is on the roster
  } else {
    myId=manualId; myName=ls("gtl_name")||""; meGuest = !!myName;  // a typed name is always a guest
  }
}
function haveIdentity(){ return !!authUser || !!myName; }

function configMissing(){ return !FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.indexOf("PASTE")===0 || FIREBASE_CONFIG.databaseURL.indexOf("PASTE")>-1; }

function recompute(){
  curKey = control && control.activeGame ? roundKey(control.activeGame,control.round) : null;
  subs = curKey ? Object.values(allSubs).filter(s=>s && s.roundKey===curKey) : [];
}

function boot(){
  if(typeof firebase==="undefined"){ renderSdkError(); return; }
  if(configMissing()){ renderSetup(); return; }
  try{
    firebase.initializeApp(FIREBASE_CONFIG); fb = firebase.database();
  }catch(e){ renderSetup(e); return; }
  /* Google sign-in — optional. Works once the instructor enables the Google
     provider and authorizes this domain in the Firebase console. If the auth
     SDK is absent or setup isn't done, the app still runs with name-join. */
  try{
    if(firebase.auth){
      fbAuth=firebase.auth();
      /* Sign-in-first (Option A): under REQUIRE_GOOGLE the database listeners attach
         only once a user is signed in, and detach on sign-out — so nothing is read
         (and nothing is shown) until authentication, and the rules can require auth. */
      fbAuth.onAuthStateChanged(u=>{
        authUser=u; authResolved=true; applyIdentity();
        if(REQUIRE_GOOGLE){ if(u) attachData(); else detachData(); }
        render();
      });
      fbAuth.getRedirectResult().catch(()=>{});
    }
  }catch(e){ fbAuth=null; }
  if(REQUIRE_GOOGLE && !fbAuth) authResolved=true;   // can't sign in — show the (unavailable) sign-in screen, not a spinner
  if(!REQUIRE_GOOGLE) attachData();                   // legacy/open mode: read immediately, name-join allowed
  // If auth restore stalls (slow mobile connection), stop showing a bare spinner and
  // offer a reload after a few seconds. onAuthStateChanged still resolves it if it arrives.
  setTimeout(()=>{ if(!authResolved){ authSlow=true; render(); } }, 7000);
  render();
}
/* control/subs/roster live data — attached/detached around authentication under Option A. */
function onCtrl(snap){ control = snap.exists()?snap.val():null; controlLoaded=true; recompute(); render(); }
function onSubs(snap){ allSubs = snap.val()||{}; recompute(); render(); }
function onRoster(snap){ setRoster(snap.val()); render(); }
function onCourses(snap){ courses = snap.val()||{}; render(); }
function onEnroll(snap){ enroll = snap.val()||{}; maybeAutoRoute(); render(); }
function attachData(){
  if(listenersOn) return; listenersOn=true;
  fb.ref(CTRL_PATH()).on("value", onCtrl, err=>{ console.warn("control",err); renderRulesError(); });
  fb.ref(SUBS_PATH()).on("value", onSubs, err=>{ console.warn("subs",err); });
  fb.ref(ROSTER_PATH()).on("value", onRoster, err=>{ console.warn("roster",err); });
  fb.ref(COURSES_PATH).on("value", onCourses, err=>{ console.warn("courses",err); });
  if(authUser&&authUser.email) fb.ref(ENROLL_DOC(authUser.email)).on("value", onEnroll, err=>{ console.warn("enroll",err); });
}
function detachData(){
  if(!listenersOn) return; listenersOn=false;
  try{ fb.ref(CTRL_PATH()).off(); fb.ref(SUBS_PATH()).off(); fb.ref(ROSTER_PATH()).off(); fb.ref(COURSES_PATH).off(); }catch(e){}
  control=null; controlLoaded=false; allSubs={}; roster={}; rosterList=[]; courses={}; enroll={}; recompute();
}
/* My enrolled course ids, from the enrollment index (signed-in students only). */
function myCourses(){ return enroll && typeof enroll==="object" ? Object.keys(enroll).filter(k=>enroll[k]) : []; }
/* On a bare link (no ?class=), send a signed-in student to their course:
   exactly one enrolment → redirect; several → a picker (rendered in render()); none → stay as guest. */
function maybeAutoRoute(){
  if(routed || HAS_CLASS_PARAM || isTeacher() || !authUser) return;
  const mine=myCourses();
  if(mine.length===1 && mine[0] && mine[0]!=="main"){
    routed=true;
    try{ location.search="?class="+encodeURIComponent(mine[0]); }catch(e){}
  }
}
document.addEventListener("DOMContentLoaded", boot);

async function writeControl(patch){
  try{
    const ref = fb.ref(CTRL_PATH());
    const cur = await ref.once("value");
    if(cur.exists()) await ref.update(patch);
    else await ref.set(Object.assign({createdAt:Date.now()},patch));
    return true;
  }catch(e){ toast("Couldn't update — check your connection"); return false; }
}
function cfg(game){ return Object.assign({}, DEFAULT_CONFIG[game], (control&&control.config&&control.config[game])||{}); }

async function submit(payload){
  const key=roundKey(control.activeGame,control.round);
  const doc={ roundKey:key, session:curSession(), game:control.activeGame, round:control.round, studentId:myId, name:myName||"Anon", ts:Date.now() };
  if(meGuest) doc.guest=true;
  if(authUser&&authUser.email) doc.email=authUser.email.toLowerCase();
  if(curMSection()) doc.msection=curMSection();   // the section this meeting is running
  const rn=roster[String(myId).toLowerCase()];    // stamp roster fields for later analysis/export
  if(rn){ if(rn.sid)doc.sid=rn.sid; if(rn.area)doc.area=rn.area; if(rn.section)doc.section=rn.section; }
  Object.assign(doc,payload);
  try{ await fb.ref(SUB_DOC(key,myId)).set(doc); }
  catch(e){ toast("Submit failed — check connection"); }
}
function mySub(){ return subs.find(s=>s.studentId===myId) || null; }

async function clearRound(){
  if(!control||!control.activeGame) return;
  const key=roundKey(control.activeGame,control.round);
  for(const s of subs.slice()){ try{ await fb.ref(SUB_DOC(key,s.studentId)).remove(); }catch(e){} }
  toast("Round data cleared");
}

/* ─── roster (instructor) ─── */
async function writeRoster(list){
  try{
    await fb.ref(ROSTER_PATH()).set(list);
    // Register this course in the global picker and index each email→course for auto-routing.
    try{ if(!courses[ROOM]) await fb.ref(COURSES_PATH+"/"+ROOM).update({name:(courses[ROOM]&&courses[ROOM].name)||ROOM, createdAt:Date.now()}); }catch(e){}
    try{ const up={}; list.forEach(e=>{ if(e.email) up[encodeKey(String(e.email).toLowerCase())+"/"+ROOM]=true; }); if(Object.keys(up).length) await fb.ref("enroll").update(up); }catch(e){}
    return true;
  }catch(e){ toast("Couldn't save roster"); return false; }
}
/* Create/register a course in the global registry, then open it. */
async function createCourse(id,name){
  id=String(id||"").replace(/[^A-Za-z0-9_-]/g,"").slice(0,60); if(!id) return false;
  try{ await fb.ref(COURSES_PATH+"/"+id).update({name:name||id, createdAt:Date.now()}); }catch(e){ toast("Couldn't create course"); return false; }
  try{ location.search="?class="+encodeURIComponent(id); }catch(e){}
  return true;
}
async function removeRoster(){ try{ await fb.ref(ROSTER_PATH()).remove(); toast("Roster cleared"); }catch(e){} }
/* Accepts a plain "email, name" list OR a spreadsheet paste with a header row
   (ID / Name / Email / Area / Section in any column order). Tabs, commas, semicolons
   or 2+ spaces separate columns, so single-spaced names stay intact. */
function parseRoster(text){
  const lines=String(text||"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return [];
  const split=l=> l.split(/\t|,|;|\s{2,}/).map(x=>x.trim());
  let cols=null, start=0;
  if(!lines[0].includes("@") && /email|name|section|\bid\b|area/i.test(lines[0])){
    cols={}; split(lines[0]).forEach((h,i)=>{ const k=h.toLowerCase();
      if(/e-?mail/.test(k)) cols.email=i; else if(/name/.test(k)) cols.name=i;
      else if(/section/.test(k)) cols.section=i; else if(/area/.test(k)) cols.area=i;
      else if(/id/.test(k)) cols.sid=i; });
    start=1;
  }
  const out=[], seen={};
  for(let li=start; li<lines.length; li++){
    const p=split(lines[li]); if(!p.length) continue;
    let email="", name="", sid="", area="", section="";
    if(cols && cols.email!=null){
      email=(p[cols.email]||""); name=cols.name!=null?p[cols.name]:"";
      sid=cols.sid!=null?p[cols.sid]:""; area=cols.area!=null?p[cols.area]:""; section=cols.section!=null?p[cols.section]:"";
    } else {
      const ei=p.findIndex(x=>x.includes("@")); if(ei<0) continue;
      email=p[ei];
      if(p.length>=5){ sid=p[0]; name=p[1]; area=p[3]||""; section=p[4]||""; }
      else { name=p.filter((x,i)=>i!==ei).join(" "); }
    }
    email=(email||"").trim().toLowerCase(); if(!email.includes("@")) continue;
    if(seen[email]) continue; seen[email]=1;
    out.push({ email, name:(name||"").trim()||email, sid:(sid||"").trim(), area:(area||"").trim(), section:(section||"").trim().toUpperCase() });
  }
  return out;
}

/* ─── Google sign-in (student) ─── */
async function googleSignIn(){
  if(!fbAuth){ toast("Google sign-in isn't available here"); return; }
  const provider=new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({ prompt:"select_account" });
  try{ await fbAuth.signInWithPopup(provider); }
  catch(e){
    const c=e&&e.code;
    if(c==="auth/popup-blocked"||c==="auth/popup-closed-by-user"||c==="auth/cancelled-popup-request"){
      try{ await fbAuth.signInWithRedirect(provider); return; }catch(e2){ toast(googleErr(e2)); }
    } else { toast(googleErr(e)); }
  }
}
function googleErr(e){
  const c=e&&e.code||"";
  if(c==="auth/operation-not-allowed") return "Google sign-in isn't switched on yet — ask your instructor.";
  if(c==="auth/unauthorized-domain") return "This page isn't authorized for Google sign-in yet.";
  return "Google sign-in didn't complete — try again, or join with your name.";
}
async function signOutStudent(){ try{ if(fbAuth) await fbAuth.signOut(); }catch(e){} }

/* ═══════════════════════ RENDER ROOT ═══════════════════════ */
/* Under lockdown, console access requires an allowlisted Google sign-in (matching
   what the strict rules enforce) — a leftover passcode session isn't enough. */
function isTeacher(){
  if(!(role==="teacher" && unlocked)) return false;
  if(REQUIRE_GOOGLE) return !!(authUser && isInstructorEmail(authUser.email));
  return true;
}
/* The course label shown in the header: the registered course name, else the room
   id, else the lab tagline for the default room. */
function courseLabel(){
  const nm=(courses[ROOM]&&courses[ROOM].name)||"";
  if(nm) return nm;
  if(ROOM && ROOM!=="main") return ROOM;
  return "Strategic Interaction Lab";
}
function syncBrand(){ const s=$("#brandSub"); if(s) s.textContent=courseLabel(); }
function render(){
  applyIdentity();
  syncPhasePill();
  syncBrand();
  const app = $("#app");
  if(REQUIRE_GOOGLE && !authUser){
    app.replaceChildren(authResolved ? signInLanding() : connectingScreen());
    return;
  }
  // Signed-in student on the bare link, enrolled in more than one course → let them choose.
  if(!HAS_CLASS_PARAM && !isTeacher() && authUser && !routed && myCourses().length>1){
    app.replaceChildren(coursePicker());
    return;
  }
  if(!control || !control.activeGame){
    app.replaceChildren(isTeacher() ? teacherConsole() : studentWaiting());
    return;
  }
  if(isTeacher()){ app.replaceChildren(teacherConsole()); return; }
  app.replaceChildren(studentView());
}
function connectingScreen(){
  const c=el("div","card stage center"); c.style.padding="clamp(30px,6vw,60px)";
  c.append(el("div","eyebrow gold","Live classroom"));
  c.append(Object.assign(el("div","mut"),{textContent: authSlow?"Still connecting…":"Connecting…",style:"margin-top:8px;font-size:1.05rem"}));
  if(authSlow){
    // Auth restore is taking too long (usually a slow/flaky connection). It will still
    // finish on its own when the network recovers, but give the student a way out.
    c.append(Object.assign(el("p","sm mut"),{textContent:"This is taking longer than usual — you're probably on a slow connection. It'll continue automatically, or you can reload.",style:"margin:10px auto 16px;max-width:340px"}));
    const b=el("button","btn","Reload"); b.onclick=()=>{ try{location.reload();}catch(e){} }; c.append(b);

function syncPhasePill(){
  const p=$("#phasePill"), t=$("#phaseTxt");
  p.className="pill";
  if(!control||!control.activeGame){ t.textContent="Waiting to start"; p.classList.add("wait"); return; }
  if(control.phase==="open"){ p.classList.add("live"); t.textContent="Submissions open · "+GAMES[control.activeGame].short+" R"+control.round; }
  else if(control.phase==="revealed"){ p.classList.add("reveal"); t.textContent="Results revealed · "+GAMES[control.activeGame].short+" R"+control.round; }
  else { p.classList.add("wait"); t.textContent="Round set — not open yet"; }
}

function revealNarr(g){
  if(g==="guess23") return "Where did the class land relative to pure rationality?";
  if(g==="pd") return "Did people keep the money for themselves or give it to their partner?";
  return "How close did the group get to the socially optimal outcome?";

function analyzeGuess(teacher,list){
  list=list||subs;
  const cf=cfg("guess23");
  const vals=list.map(s=>Number(s.value)).filter(v=>!isNaN(v)).sort((a,b)=>a-b);
  const n=vals.length, mean=vals.reduce((a,b)=>a+b,0)/n;
  const target=cf.frac*mean;
  const median = n%2?vals[(n-1)/2]:(vals[n/2-1]+vals[n/2])/2;
  let best=Infinity,winners=[]; list.forEach(s=>{const d=Math.abs(Number(s.value)-target); if(d<best-1e-9){best=d;winners=[s];}else if(Math.abs(d-best)<1e-9)winners.push(s);});
  const zeros=vals.filter(v=>v===0).length;
  const mine = !teacher ? mySub() : null;
  const myVal = mine && mine.value!=null ? Number(mine.value) : null;
  const iWon = myVal!=null && winners.some(w=>w.studentId===myId);
  const markers=[{x:target,l:"Target",strong:true}];
  if(myVal!=null) markers.push({x:myVal,l:"You ("+fmt(myVal,1)+")",col:"#3b6fe0",strong:true});
  const wrap=el("div","grid-analysis");
  const left=el("div","chart-card");
  left.append(Object.assign(el("h3"),{textContent:"Distribution of guesses"}),
    Object.assign(el("div","cap"),{textContent:"Each bar counts guesses in a 5-wide bin. The gold line marks the winning target"+(myVal!=null?"; the blue line is your guess.":".")}));
  left.append(histogram(vals,cf.min,cf.max,5,markers,target));
  left.append(levelLegend(myVal!=null));
  wrap.append(left);
  const right=el("div","stack");
  const st=el("div","stats");
  const tiles=[statTile("Class average",fmt(mean,1),"of all guesses"),
    statTile("Target",fmt(target,1),fmt(cf.frac*100,0)+"% of the mean · closest wins",true),
    statTile("Median",fmt(median,1)),
    statTile("Guessed 0",zeros+" ("+pct(zeros/n)+")","fully rational")];
  st.append(...tiles);
  right.append(st);
  const nb=el("div","note-box");
  const avgLevel = mean>0 ? Math.max(0, Math.log(mean/50)/Math.log(cf.frac)) : 5;
  nb.innerHTML="<b>Remark:</b> the only Nash equilibrium is everyone guessing 0. The class average of "+fmt(mean,1)+" implies roughly <b>"+fmt(avgLevel,1)+" levels</b> of iterated \"if they think, then I think…\" reasoning — real people stop a few steps short of full rationality (level-k thinking).";
  right.append(nb);
  wrap.append(right);
  const out=el("div","stack");
  out.append(guessWinnerCard(winners,target));
  if(myVal!=null) out.append(myGuessCard(myVal,target,iWon));
  out.append(wrap);
  return out;

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m])); }
/* The Google email on a submission (the studentId is the email under Google sign-in). */
function subEmail(s){ return s.email || (String(s&&s.studentId||"").includes("@") ? String(s.studentId) : ""); }
/* Deterministic PRNG (xorshift) seeded from a string — same pairing on every device. */
function seededRand(seedStr){
  let s=5381; for(let i=0;i<seedStr.length;i++) s=((s<<5)+s+seedStr.charCodeAt(i))>>>0;
  if(s===0) s=1;
  return ()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; };
}
/* Randomly pair the round's submissions. Sorted by studentId first so the shuffle is
   identical for the instructor and every student; last player unpaired if odd. */
function pairSubs(list){
  const a=list.slice().sort((x,y)=> x.studentId<y.studentId?-1:x.studentId>y.studentId?1:0);
  const rand=seededRand("pair-"+(curKey||""));
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rand()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  const pairs=[]; for(let i=0;i<a.length;i+=2){ pairs.push([a[i], a[i+1]||null]); }
  return pairs;
}
/* Payoff to a player who chose `mine` against a partner who chose `partner`. */

function analyzePG(list){
  list=list||subs;
  const cf=cfg("publicgoods");
  const contribs=list.map(s=>Number(s.contrib)).filter(v=>!isNaN(v));
  const n=contribs.length, total=contribs.reduce((a,b)=>a+b,0), avg=total/n;
  const perHead=cf.mpcr*total;
  const freeRiders=contribs.filter(v=>v===0).length, fullCoop=contribs.filter(v=>v===cf.E).length;
  const groupEarnings=contribs.reduce((a,c)=>a+(cf.E-c)+perHead,0);
  const maxEarnings=n*(cf.mpcr*(n*cf.E));
  const nashEarnings=n*cf.E;
  const efficiency=(groupEarnings-nashEarnings)/(maxEarnings-nashEarnings);
  const wrap=el("div","grid-analysis");
  const left=el("div","chart-card");
  left.append(Object.assign(el("h3"),{textContent:"How much each person contributed"}),
    Object.assign(el("div","cap"),{textContent:"Bins across the 0–"+cf.E+" token range. Left pile = free-riders, right pile = full contributors."}));
  left.append(histogram(contribs,0,cf.E,Math.max(1,Math.round(cf.E/10)),[{x:avg,l:"Avg "+fmt(avg,1),strong:true}],avg));
  const bar=el("div"); bar.style.marginTop="18px";
  bar.append(Object.assign(el("h3"),{textContent:"Group earnings vs the two benchmarks",style:"font-size:.95rem;margin-bottom:8px"}));
  bar.append(barChart([
    {label:"Nash (all keep)",value:Math.round(nashEarnings),color:"var(--bad)"},
    {label:"This class",value:Math.round(groupEarnings),color:"var(--accent)"},
    {label:"Social optimum",value:Math.round(maxEarnings),color:"var(--good)"}
  ], maxEarnings, false, " tok"));
  left.append(bar);
  wrap.append(left);
  const right=el("div","stack");
  const st=el("div","stats");
  st.append(statTile("Avg contribution",fmt(avg,1)+" / "+cf.E,pct(avg/cf.E)+" of endowment",true),
    statTile("Group efficiency",pct(efficiency),"of gains captured","good"),
    statTile("Free-riders",freeRiders,"contributed 0","bad"),
    statTile("Full contributors",fullCoop,"gave everything","good"));
  right.append(st);
  const nb=el("div","note-box");
  nb.innerHTML="<b>Teaching point:</b> each token you keep is worth 1 to you; each token you contribute returns only "+cf.mpcr+" to <i>you</i> — so the private incentive is to give nothing (Nash). Yet every contributed token creates "+fmt(cf.mpcr*n,1)+" tokens of total value, so the group optimum is for everyone to give everything. The class captured <b>"+pct(efficiency)+"</b> of that surplus — the gap is the cost of free-riding.";
  right.append(nb);
  const nb2=el("div","note-box teal");
  nb2.innerHTML="Total contributed to the fund: <b>"+fmt(total,0)+"</b> tokens → boosted to <b>"+fmt(perHead*n,0)+"</b> and shared, paying each member "+fmt(perHead,1)+" back.";
  right.append(nb2);
  wrap.append(right);
  return wrap;
}

function statTile(k,v,note,kind){
  const t=el("div","stat"+(kind==="good"?" good":kind==="bad"?" bad":kind===true?" hl":""));
  t.append(Object.assign(el("div","k"),{textContent:k}));
  const vv=el("div","v"); vv.textContent=v; t.append(vv);
  if(note) t.append(Object.assign(el("div","note"),{textContent:note}));
  return t;
}
function barChart(items, maxRef, showVals, suffix){
  suffix=suffix||"";
  const max=Math.max(maxRef||0, ...items.map(i=>i.value), 1);
  const W=520,rowH=46,pad=8, labelW=150, H=items.length*rowH+pad;
  const svg=svgEl("svg",{viewBox:`0 0 ${W} ${H}`,role:"img"});
  items.forEach((it,i)=>{
    const y=i*rowH+pad, bw=(W-labelW-70)*(it.value/max);
    svg.append(svgEl("text",{x:labelW-10,y:y+rowH/2,"text-anchor":"end","dominant-baseline":"middle",fill:"var(--ink-2)","font-size":"13","font-family":"IBM Plex Sans"},it.label));
    svg.append(svgEl("rect",{x:labelW,y:y+8,width:Math.max(0,bw),height:rowH-22,rx:5,fill:it.color}));
    svg.append(svgEl("text",{x:labelW+Math.max(0,bw)+8,y:y+rowH/2,"dominant-baseline":"middle",fill:"var(--ink)","font-size":"13","font-weight":"600","font-family":"IBM Plex Mono"}, (showVals?fmt(it.value,2):it.value)+suffix));
  });
  return svg;
}
function histogram(values,min,max,binW,markers,meanLine){
  const bins=[]; const nb=Math.ceil((max-min)/binW)+1;
  for(let i=0;i<nb;i++)bins.push(0);
  values.forEach(v=>{ let idx=Math.floor((v-min)/binW); if(idx<0)idx=0; if(idx>=nb)idx=nb-1; bins[idx]++; });
  const maxC=Math.max(...bins,1);
  const W=540,H=230, padL=34,padR=14,padT=18,padB=42, iw=W-padL-padR, ih=H-padT-padB;
  const svg=svgEl("svg",{viewBox:`0 0 ${W} ${H}`,role:"img"});
  for(let g=0;g<=maxC;g+=Math.max(1,Math.ceil(maxC/4))){
    const y=padT+ih-(g/maxC)*ih;
    svg.append(svgEl("line",{x1:padL,y1:y,x2:W-padR,y2:y,stroke:"var(--line-2)","stroke-width":1}));
    svg.append(svgEl("text",{x:padL-6,y:y+3,"text-anchor":"end",fill:"var(--faint)","font-size":"10","font-family":"IBM Plex Mono"},g));
  }
  const bw=iw/nb;
  bins.forEach((c,i)=>{
    const x=padL+i*bw, h=(c/maxC)*ih, y=padT+ih-h;
    svg.append(svgEl("rect",{x:x+1.5,y,width:Math.max(0,bw-3),height:h,rx:3,fill:"var(--accent)","fill-opacity":c?0.82:0}));
    if(c) svg.append(svgEl("text",{x:x+bw/2,y:y-4,"text-anchor":"middle",fill:"var(--muted)","font-size":"10","font-family":"IBM Plex Mono"},c));
  });
  const rng=(max-min)||1, rough=rng/6, mag=Math.pow(10,Math.floor(Math.log10(rough)));
  const tickStep=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=rough)||10*mag;
  for(let v=Math.ceil(min/tickStep)*tickStep; v<=max+1e-9; v+=tickStep){
    const x=padL+((v-min)/rng)*iw;
    svg.append(svgEl("line",{x1:x,y1:padT+ih,x2:x,y2:padT+ih+4,stroke:"var(--line)","stroke-width":1}));
    svg.append(svgEl("text",{x,y:H-padB+16,"text-anchor":"middle",fill:"var(--muted)","font-size":"11","font-family":"IBM Plex Mono"},(Math.round(v*10)/10)));
  }
  svg.append(svgEl("line",{x1:padL,y1:padT+ih,x2:W-padR,y2:padT+ih,stroke:"var(--line)","stroke-width":1.5}));
  (markers||[]).forEach(m=>{
    if(m.x<min||m.x>max) return;
    const x=padL+((m.x-min)/(max-min||1))*iw;
    const col=m.col||(m.strong?"var(--gold)":"var(--faint)");
    svg.append(svgEl("line",{x1:x,y1:padT-6,x2:x,y2:padT+ih,stroke:col,"stroke-width":m.strong?2:1.2,"stroke-dasharray":m.strong?"":"3 3"}));
    svg.append(svgEl("text",{x:Math.min(Math.max(x,padL+2),W-padR-2),y:padT-9,"text-anchor":"middle",fill:col,"font-size":"10","font-weight":m.strong?"700":"500","font-family":"IBM Plex Sans"},m.l));
  });
  return svg;
}
function svgEl(tag,attrs,text){
  const e=document.createElementNS("http://www.w3.org/2000/svg",tag);
  for(const k in attrs) e.setAttribute(k,attrs[k]);
  if(text!=null) e.textContent=text;
  return e;
}
function colorMatrix(cf,mine,full,played,participant){
  const wrap=el("div"); if(full){ wrap.className="chart-card"; wrap.append(Object.assign(el("h3"),{textContent:"Payoff matrix (you, partner)",style:"margin-bottom:10px"})); } else { wrap.style.marginTop="16px"; wrap.style.overflowX="auto"; }
  const pay=(a,b)=> (a==="keep"?cf.keep:0)+(b==="give"?cf.give:0);
  const cellTxt=(a,b)=> pay(a,b)+", "+pay(b,a);
  const nm=ch=> ch==="keep"?"Keep":"Give";
  const K="<b>Keep</b>", G="<b>Give</b>";
  // Shading + legend only in the results view. The participant view highlights the cell
  // they actually landed in ("You played") instead of the Nash equilibrium.
  const showNash = full && !participant;
  const cellCls=(row,col)=>{ let c="cell";
    if(showNash && row==="keep" && col==="keep") c+=" nash";
    if(full && row==="give" && col==="give") c+=" pareto";
    if(played && played.you===row && played.partner===col) c+=" played";
    return c; };
  const t=el("table","matrix");
  t.innerHTML=
    "<tr><th></th><th colspan='2'>Your partner</th></tr>"+
    "<tr><th></th><th>"+K+"</th><th>"+G+"</th></tr>"+
    "<tr><th>You "+K+"</th>"+
      "<td class='"+cellCls("keep","keep")+"'>"+cellTxt("keep","keep")+"</td>"+
      "<td class='"+cellCls("keep","give")+"'>"+cellTxt("keep","give")+"</td></tr>"+
    "<tr><th>You "+G+"</th>"+
      "<td class='"+cellCls("give","keep")+"'>"+cellTxt("give","keep")+"</td>"+
      "<td class='"+cellCls("give","give")+"'>"+cellTxt("give","give")+"</td></tr>";
  wrap.append(t);
  if(full){
    const lg=el("div","legend");
    const g=el("span","legc"); const gs=el("span","swatch"); gs.style.background="var(--good)"; g.append(gs,document.createTextNode("Best for the pair (Give, Give)"));
    lg.append(g);
    if(participant){
      if(played){ const y=el("span","legc"); const ys=el("span","swatch"); ys.style.cssText="background:transparent;border:2px solid var(--accent)"; y.append(ys,document.createTextNode("You played ("+nm(played.you)+", "+nm(played.partner)+")")); lg.append(y); }
    } else {
      const r=el("span","legc"); const rs=el("span","swatch"); rs.style.background="var(--bad)"; r.append(rs,document.createTextNode("Nash equilibrium (Keep, Keep)")); lg.append(r);
    }
    wrap.append(lg);
  }
  return wrap;
}

function openInstructorGate(){
  const app=$("#app");
  // Allowlisted Google instructors skip the passcode entirely.
  if(authUser && isInstructorEmail(authUser.email)){ becomeTeacher(); return; }
  // Lockdown mode: instructor access is Google-allowlist only, no passcode.
  if(REQUIRE_GOOGLE){
    const wrap=el("div","setup-wrap"); const card=el("div","card stage");
    card.append(el("div","eyebrow","Instructor access"),
      Object.assign(el("h2"),{textContent:"Sign in as an instructor",style:"font-size:1.5rem;margin:6px 0 6px"}));
    card.append(el("p","lead", authUser
      ? "The account "+(authUser.email||"you're signed in with")+" isn't on the instructor list. Sign in with an instructor Google account, or ask to be added."
      : "Sign in with your instructor Google account to open the console."));
    const row=el("div","stack"); row.style.marginTop="16px"; row.style.maxWidth="320px";
    if(fbAuth){ const gb=el("button","gbtn"); gb.textContent="Continue with Google"; gb.onclick=googleSignIn; row.append(gb); }
    if(authUser){ const so=el("button","ghost-btn","Sign out"); so.onclick=async()=>{ await signOutStudent(); }; row.append(so); }
    const cancel=el("button","btn neutral","Cancel"); cancel.onclick=render; row.append(cancel);
    card.append(row); wrap.append(card); app.replaceChildren(wrap); return;
  }
  const wrap=el("div","setup-wrap");
  const card=el("div","card stage");
  const hasPass = !!(control && control.passHash);
  const controlExists = !!control;
  card.append(el("div","eyebrow","Instructor access"),
    Object.assign(el("h2"),{textContent: hasPass?"Enter instructor passcode":controlExists?"Set an instructor passcode":"Set up this classroom session",style:"font-size:1.5rem;margin:6px 0 6px"}));
  card.append(el("p","lead", hasPass?"Enter the passcode you chose when you created this session.":controlExists?"This room has no instructor passcode yet. Choose one to take control — the current round stays exactly as it is.":"You're the first here. Choose a passcode — you'll re-enter it to run the console. Students never need it."));
  const f=el("div","field"); f.style.marginTop="16px"; f.style.maxWidth="300px";
  const inp=el("input","input"); inp.type="password"; inp.placeholder="Passcode"; inp.autofocus=true;
  f.append(inp);
  const row=el("div","row"); row.style.marginTop="16px";
  const b=el("button","btn", hasPass?"Unlock console":controlExists?"Set passcode":"Create session");
  const cancel=el("button","btn neutral","Cancel"); cancel.onclick=render;
  row.append(b,cancel);
  const err=el("div","sm"); err.style.color="var(--bad)"; err.style.marginTop="10px";
  const go=async()=>{
    const code=inp.value.trim(); if(!code){inp.focus();return;}
    // Re-read live state at click time — control may have loaded since the gate opened.
    if(control && control.passHash){
      if(hash(code)===control.passHash){ becomeTeacher(); }
      else { err.textContent="Incorrect passcode."; inp.value=""; inp.focus(); }
      return;
    }
    // No passcode set yet. Don't guess at DB state until we've heard from the server —
    // otherwise a click during load could create a fresh room and wipe a live round.
    if(!controlLoaded){ err.textContent="Still connecting to the room — wait a second and try again."; return; }
    b.disabled=true; err.textContent="";
    // If a room already exists, only add the passcode; never reset the active game/round/phase.
    const patch = control
      ? { passHash:hash(code) }
      // Don't bake DEFAULT_CONFIG into the room — let cfg() fall back to the live code
      // defaults, so changing a default (e.g. the guess fraction) takes effect for new rooms.
      : { passHash:hash(code), config:{}, activeGame:null, round:1, phase:"waiting" };
    const ok = await writeControl(patch);
    b.disabled=false;
    if(ok){ becomeTeacher(); }
    else { err.textContent="Couldn't save the passcode — check your connection and try again."; }
  };
  b.onclick=go; inp.onkeydown=e=>{if(e.key==="Enter")go();};
  card.append(f,row,err); wrap.append(card); app.replaceChildren(wrap);
}

/* Course picker (top of the console): switch between courses or start a new one.
   Each course is its own room (?class=<id>); the roster is set once per course. */
function courseCard(){
  const wrap=el("div","rail-sec");
  wrap.append(Object.assign(el("h3"),{textContent:"Course"}));
  const ids=Object.keys(courses).sort();
  const curName=(courses[ROOM]&&courses[ROOM].name)||ROOM;
  wrap.append(Object.assign(el("div","sm mut"),{textContent:"Now showing: "+curName+(curName!==ROOM?" ("+ROOM+")":"")}));
  if(ids.length){
    const sel=el("select","input"); sel.style.marginTop="8px"; sel.style.width="100%";
    if(!courses[ROOM]){ const o=document.createElement("option"); o.value=ROOM; o.textContent=ROOM+" (current)"; o.selected=true; sel.append(o); }
    ids.forEach(id=>{ const o=document.createElement("option"); o.value=id; o.textContent=(courses[id].name||id)+" · "+id; if(id===ROOM)o.selected=true; sel.append(o); });
    sel.onchange=()=>{ if(sel.value&&sel.value!==ROOM){ try{location.search="?class="+encodeURIComponent(sel.value);}catch(e){} } };
    wrap.append(sel);
  }
  const nc=el("button","ghost-btn","New course"); nc.style.marginTop="8px";
  nc.onclick=()=>{ const name=prompt("Course name (e.g. PGP Game Theory 2026)"); if(!name)return;
    const suggest=name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"").slice(0,40);
    const id=prompt("Short id for the class link (letters, numbers, dashes):", suggest); if(!id)return;
    createCourse(id,name); };
  wrap.append(nc);
  return wrap;
}

function rosterEditor(){
  const wrap=el("div","stack");
  const ta=el("textarea","input mono"); ta.rows=5; ta.style.fontSize=".78rem";
  ta.placeholder="Paste the class list with a header row, e.g.\nID  Name  Email  Area  Section\nPGP41028  Pavan B S  pgp41028@iiml.ac.in  PGP  A";
  ta.value=rosterList.length ? ("id, name, email, area, section\n"+rosterList.map(e=>[e.sid,e.name,e.email,e.area,e.section].join(", ")).join("\n")) : "";
  wrap.append(Object.assign(el("div","sm mut"),{textContent:"Paste the roster with a header row — columns in any order (ID, Name, Email, Area, Section). A plain 'email, name' list also works."}));
  wrap.append(ta);
  const secs=rosterSections();
  const info=el("div","sm mut"); info.textContent = haveRoster()? (rosterList.length+" enrolled"+(secs.length?" · sections "+secs.join(", "):"")) : "No roster yet — anyone can join.";
  wrap.append(info);
  const save=el("button","btn wide","Save roster"); save.style.marginTop="2px";
  save.onclick=async()=>{ const list=parseRoster(ta.value);
    const ok=await writeRoster(list); if(ok) toast(list.length?(list.length+" students saved"):"Roster saved (empty)"); };
  wrap.append(save);
  if(haveRoster()){
    const clr=el("button","ghost-btn","Clear roster"); clr.style.marginTop="6px";
    clr.onclick=removeRoster; wrap.append(clr);
  }
  return wrap;
}
function csvCell(v){ v=(v==null?"":String(v)); return /[",\n\r]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
/* Export EVERY submission in this room (all sessions/games/rounds) as CSV for offline
   analysis and long-term retention. Reads allSubs, so it spans the whole class. */
function exportCSV(){
  const rows=Object.values(allSubs).filter(Boolean).sort((a,b)=>(a.ts||0)-(b.ts||0));
  const head=["room","session","game","round","roundKey","email","name","id","area","section","enrolled","response","timestamp"];
  const out=[head.join(",")];
  rows.forEach(s=>{
    const email=subEmail(s); const enrolled = email && roster[email.toLowerCase()] ? "yes" : "no";
    const resp = s.value!=null?s.value : (s.choice!=null?(s.choice==="keep"?"Keep":s.choice==="give"?"Give":s.choice) : (s.contrib!=null?s.contrib:""));
    out.push([ROOM, (s.session!=null?"S"+s.session:""), s.game||"", (s.round!=null?s.round:""), s.roundKey||"", email, s.name||"", s.sid||"", s.area||"", secOf(s), enrolled, resp, (s.ts?new Date(s.ts).toISOString():"")].map(csvCell).join(","));
  });
  try{
    const blob=new Blob([out.join("\r\n")],{type:"text/csv;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=ROOM+"-submissions-"+new Date().toISOString().slice(0,10)+".csv";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1500);
    toast(rows.length+" rows exported");
  }catch(e){ toast("Export failed"); }
}
/* A student's submitted response, formatted for the game they played. */
function subValue(s){
  if(s.game==="pd") return s.choice==="keep"?"Keep":"Give";
  if(s.game==="publicgoods") return s.contrib!=null?String(s.contrib):"—";
  return s.value!=null?String(s.value):"—";   // guess23 and default
}
/* Meeting-scope toggle: which section's meeting to analyze (A / B / … / Both).
   Sets sectionScope, which effScope()/analysisSubs() read. null follows the running
   section (curMSection); the buttons let the instructor override it after the fact. */
function sectionScopeBar(){
  const secs=rosterSections(); const eff=effScope();
  const card=el("div","card"); card.style.padding="12px 14px";
  const row=el("div","row"); row.style.gap="8px"; row.style.alignItems="center"; row.style.flexWrap="wrap";
  row.append(el("span","tinylabel","Analyze"));
  const mk=(val,label)=>{ const b=el("button","ghost-btn"); b.textContent=label;
    if(eff===val){ b.style.borderColor="var(--accent)"; b.style.color="var(--accent-ink)"; b.style.background="var(--accent-wash)"; }
    b.onclick=()=>{ sectionScope=val; render(); }; return b; };
  secs.forEach(s=> row.append(mk(s,"Session S"+curSession()+"."+s)));
  row.append(mk("BOTH","Both sections"));
  card.append(row);
  const running=curMSection();
  card.append(Object.assign(el("div","sm mut"),{textContent:"Each submission is tagged with the section running when it came in"+(running?(" (now S"+curSession()+"."+running+")"):"")+". Switch scope to review one section's meeting or combine both.",style:"margin-top:6px"}));
  return card;
}
function submittedTable(list){
  const rows=(list||subs).slice().sort((a,b)=>a.ts-b.ts);
  const showStatus=haveRoster(), showSec=rosterSections().length>0;
  let html="<tr><th>#</th><th>Player</th>"+(showSec?"<th>Sec</th>":"")+"<th>Response</th>"+(showStatus?"<th>Status</th>":"")+"</tr>";
  rows.forEach((s,i)=>{
    const em=subEmail(s), enrolled=!!roster[String(s.studentId).toLowerCase()];
    html+="<tr><td>"+(i+1)+"</td>"+
      "<td style='text-align:left'>"+esc(s.name)+(em?"<div class='submail'>"+esc(em)+"</div>":"")+"</td>"+
      (showSec?("<td>"+esc(secOf(s)||"—")+"</td>"):"")+
      "<td class='cell'>"+esc(subValue(s))+"</td>"+
      (showStatus?("<td>"+(enrolled?"<span style='color:var(--good);font-weight:600'>Enrolled</span>":"<span style='color:var(--gold);font-weight:600'>Guest</span>")+"</td>"):"")+
      "</tr>";
  });
  const t=el("table","matrix"); t.style.fontSize=".86rem"; t.style.marginTop="10px"; t.innerHTML=html;
  const scroll=el("div"); scroll.style.overflowX="auto"; scroll.append(t); return scroll;
}
function attendanceCard(){
  const card=el("div","card stage");
  const sc=effScope();
  const sv=analysisSubs();
  const rl = (sc==="BOTH"||!sc) ? rosterList : rosterList.filter(e=>e.section===sc);
  const subByEmail={}; sv.forEach(s=>{ subByEmail[String(s.studentId).toLowerCase()]=s; });
  const done=[], todo=[];
  rl.forEach(e=>{ (subByEmail[e.email]?done:todo).push(e); });
  const guests=sv.filter(s=>!roster[String(s.studentId).toLowerCase()]);
  const secLbl = (sc==="BOTH"||!sc)?"":" · Section "+sc;
  if(haveRoster()){
    card.append(el("div","eyebrow","Attendance"+secLbl),
      Object.assign(el("h3"),{textContent:done.length+" of "+rl.length+" "+((sc==="BOTH"||!sc)?"enrolled":"in Section "+sc)+" have submitted this round",style:"margin:4px 0 2px"}));
    if(guests.length) card.append(Object.assign(el("div","sm mut"),{textContent:guests.length+" guest"+(guests.length===1?"":"s")+" not on the class list also submitted.",style:"margin-bottom:2px"}));
  } else {
    card.append(el("div","eyebrow","Who's here"),
      Object.assign(el("h3"),{textContent:sv.length+" submitted this round",style:"margin:4px 0 2px"}),
      Object.assign(el("div","sm mut"),{textContent:"No class roster loaded yet — everyone joins as a guest. Load the roster (left) to track enrolled attendance.",style:"margin-bottom:2px"}));
  }
  if(sv.length) card.append(submittedTable(sv));
  if(haveRoster() && todo.length){
    const blk=el("div"); blk.style.marginTop="14px";
    blk.append(Object.assign(el("div","tinylabel"),{textContent:"Not yet ("+todo.length+")",style:"margin-bottom:6px"}));
    const wrap=el("div","whowrap");
    todo.forEach(e=>{ const it=el("div","who todo"); it.append(Object.assign(el("div","who-name"),{textContent:e.name})); if(e.email) it.append(Object.assign(el("div","who-mail"),{textContent:e.email})); wrap.append(it); });
    blk.append(wrap); card.append(blk);
  }
  return card;
}
function paramEditor(){
  const g=control.activeGame, cf=cfg(g); const wrap=el("div","stack");
  const mk=(label,key,val,step)=>{ const f=el("div","field");
    f.append(Object.assign(el("label"),{textContent:label}));
    const i=el("input","input mono"); i.type="number"; i.value=val; if(step)i.step=step; i.style.padding="8px 10px";
    i.onchange=()=>{ const nc=Object.assign({},(control.config&&control.config[g])||{}); nc[key]=Number(i.value);
      const conf=Object.assign({},control.config); conf[g]=nc; writeControl({config:conf}); };
    f.append(i); return f; };
  if(g==="guess23"){ const grid=el("div","paramgrid");
    grid.append(mk("Fraction of average","frac",cf.frac,"0.01"),mk("Max value","max",cf.max),mk("Rounding step","step",cf.step,"0.5")); wrap.append(grid);
    wrap.append(Object.assign(el("div","sm mut"),{textContent:"Step 0.5 accepts halves; set 1 for whole numbers only."})); }
  else if(g==="pd"){ const grid=el("div","paramgrid");
    grid.append(mk("Keep: $ to self","keep",cf.keep),mk("Give: $ to partner","give",cf.give));
    wrap.append(grid); wrap.append(Object.assign(el("div","sm mut"),{textContent:"Set Give > Keep so giving is socially better, and Keep > 0 so keeping stays individually tempting."})); }
  else { const grid=el("div","paramgrid");
    grid.append(mk("Endowment","E",cf.E),mk("Return / token","mpcr",cf.mpcr,"0.05")); wrap.append(grid);
    wrap.append(Object.assign(el("div","sm mut"),{textContent:"Return<1 keeps free-riding tempting individually."})); }
  return wrap;
}

/* ═══════════════════════ SETUP / ERROR SCREENS ═══════════════════════ */
function setupPill(txt){ const t=$("#phaseTxt"),p=$("#phasePill"); p.className="pill wait"; t.textContent=txt; }
function renderSetup(){
  setupPill("Setup needed");
  const wrap=el("div","setup-wrap");
  const card=el("div","card stage");
  card.append(el("div","eyebrow gold","One-time setup"),
    Object.assign(el("h2"),{textContent:"Connect your free Firebase backend",style:"font-size:1.6rem;margin:6px 0 8px"}),
    Object.assign(el("p","lead"),{textContent:"This page syncs everyone through Firebase — Google's free realtime database. It takes about 5 minutes, once. Then any student opens your link and joins, no account needed."}));
  const steps=el("div","steps");
  const S=(html)=>{ const d=el("div","step"); d.append(el("div","num")); const b=el("div","body"); b.innerHTML=html; d.append(b); return d; };
  steps.append(
    S("Go to <b>console.firebase.google.com</b> → <b>Add project</b> (any name; you can skip Google Analytics)."),
    S("In the left menu: <b>Build → Realtime Database → Create Database</b>. Pick a location, and start in <b>test mode</b>."),
    S("Project settings (gear icon) → <b>Your apps</b> → click the <b>Web</b> icon <code>&lt;/&gt;</code> → register the app → copy the <code>firebaseConfig</code> values."),
    S("Open this HTML file in a text editor, paste those values into the <code>FIREBASE_CONFIG</code> block near the top (keep the quotes; make sure <code>databaseURL</code> is filled), and save."),
    S("Host the file so students can reach it: drag it onto <b>app.netlify.com/drop</b> (easiest), or use Firebase Hosting / GitHub Pages / any web server. Share that URL with your class.")
  );
  card.append(steps);
  const nb=el("div","note-box teal"); nb.style.marginTop="18px";
  nb.innerHTML="<b>Database rules:</b> in Realtime Database → <b>Rules</b>, use <code>{ \"rules\": { \".read\": true, \".write\": true } }</code> and Publish so students can submit without signing in. Fine for a classroom — you can tighten it later. The included README has the full walkthrough.";
  card.append(nb);
  wrap.append(card); $("#app").replaceChildren(wrap);
}
function renderSdkError(){
  setupPill("Offline");
  const c=el("div","card stage"); c.append(el("div","eyebrow gold","Can't load Firebase"),
    Object.assign(el("h2"),{textContent:"The Firebase library didn't load",style:"font-size:1.4rem;margin:6px 0 8px"}),
    Object.assign(el("p","lead"),{textContent:"This page needs internet access to reach Google's Firebase CDN. Check the connection and reload. If you're opening the file directly from disk, host it (e.g. Netlify Drop) instead."}));
  $("#app").replaceChildren(c);
}
function renderRulesError(){
  setupPill("Permission error");
  const c=el("div","card stage"); c.append(el("div","eyebrow gold","Database blocked the request"),
    Object.assign(el("h2"),{textContent:"Check your Realtime Database rules",style:"font-size:1.4rem;margin:6px 0 8px"}),
    Object.assign(el("p","lead"),{textContent:"Firebase is connected but refused read/write — usually because the database is still in locked mode. In Realtime Database → Rules, set both .read and .write to true and Publish, then reload."}));
  $("#app").replaceChildren(c);
}
