<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Theory Live</title>
<meta name="description" content="A live classroom instrument for game-theory exercises.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://securetoken.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EDF1F6; --surface:#FFFFFF; --surface-2:#F5F8FC; --raised:#FFFFFF;
  --ink:#17222F; --ink-2:#39485A; --muted:#66788C; --faint:#93A3B5;
  --line:#D9E1EB; --line-2:#E7EDF4;
  --accent:#0E7A6E; --accent-ink:#0B5B52; --accent-wash:#E1F1EE;
  --gold:#A8710F; --gold-wash:#F6ECD8;
  --good:#2C7A54; --good-wash:#E2F0E7;
  --bad:#BB4632; --bad-wash:#F6E4DF;
  --warn:#B67A12;
  --shadow:0 1px 2px rgba(20,35,55,.06),0 6px 20px rgba(20,35,55,.07);
  --shadow-lg:0 2px 6px rgba(20,35,55,.08),0 18px 46px rgba(20,35,55,.13);
  --radius:14px; --radius-sm:9px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C131C; --surface:#131E2A; --surface-2:#182634; --raised:#1B2836;
    --ink:#E9EFF6; --ink-2:#B9C7D6; --muted:#8598AB; --faint:#5E7085;
    --line:#26333F; --line-2:#213040;
    --accent:#3BB9A9; --accent-ink:#8FE0D4; --accent-wash:#123029;
    --gold:#D6A548; --gold-wash:#2E2415;
    --good:#4FB483; --good-wash:#16301F; --bad:#DE7A66; --bad-wash:#331A15; --warn:#D8A23E;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.4);
    --shadow-lg:0 2px 8px rgba(0,0,0,.5),0 22px 50px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0C131C; --surface:#131E2A; --surface-2:#182634; --raised:#1B2836;
  --ink:#E9EFF6; --ink-2:#B9C7D6; --muted:#8598AB; --faint:#5E7085;
  --line:#26333F; --line-2:#213040;
  --accent:#3BB9A9; --accent-ink:#8FE0D4; --accent-wash:#123029;
  --gold:#D6A548; --gold-wash:#2E2415;
  --good:#4FB483; --good-wash:#16301F; --bad:#DE7A66; --bad-wash:#331A15; --warn:#D8A23E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.4);
  --shadow-lg:0 2px 8px rgba(0,0,0,.5),0 22px 50px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
img{max-width:100%}
h1,h2,h3{font-family:"Fraunces",Georgia,serif; font-weight:600; text-wrap:balance; margin:0; letter-spacing:-.01em; color:var(--ink)}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace; font-variant-numeric:tabular-nums}
button{font-family:inherit; cursor:pointer}
input,select{font-family:inherit; font-size:1rem}
a{color:var(--accent-ink)}
code{font-family:"IBM Plex Mono",monospace; background:var(--surface-2); padding:1px 5px; border-radius:5px; font-size:.85em; border:1px solid var(--line)}

.shell{max-width:1120px; margin:0 auto; padding:20px clamp(14px,3vw,30px) 72px}
.topbar{display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding:14px 4px 20px}
.course-sel{font:inherit; font-size:.85rem; font-weight:600; color:var(--ink-2); background:var(--surface-2);
  border:1px solid var(--line); border-radius:var(--radius-sm); padding:7px 10px; max-width:min(46vw,220px)}
.brand{display:flex; align-items:center; gap:12px; margin-right:auto}
.brand .glyph{width:38px;height:38px;border-radius:10px;background:
  radial-gradient(circle at 30% 28%,var(--accent) 0 42%,transparent 44%),
  radial-gradient(circle at 72% 74%,var(--gold) 0 34%,transparent 36%),
  var(--surface); border:1px solid var(--line); box-shadow:var(--shadow); flex:none}
.brand h1{font-size:1.32rem}
.brand .sub{font-size:.72rem; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); font-weight:600}
.brand-course{white-space:nowrap}
@media (max-width:480px){ .brand-course{display:block} }
.pill{display:inline-flex; align-items:center; gap:7px; padding:6px 12px; border-radius:999px; font-size:.78rem; font-weight:600; border:1px solid var(--line); background:var(--surface); color:var(--ink-2); white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.pill.live{color:var(--good); border-color:color-mix(in srgb,var(--good) 40%,var(--line))}
.pill.live .dot{background:var(--good); box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent); animation:pulse 2s infinite}
.pill.wait{color:var(--warn)}
.pill.reveal{color:var(--gold); border-color:color-mix(in srgb,var(--gold) 40%,var(--line))}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}

.ghost-btn{background:var(--surface); border:1px solid var(--line); color:var(--ink-2); padding:8px 14px; border-radius:var(--radius-sm); font-weight:600; font-size:.85rem; transition:.15s}
.ghost-btn:hover{border-color:var(--accent); color:var(--accent-ink)}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
.stage{padding:clamp(20px,3.4vw,40px)}
.eyebrow{font-size:.74rem; letter-spacing:.14em; text-transform:uppercase; color:var(--accent-ink); font-weight:600}
.eyebrow.gold{color:var(--gold)}
.lead{color:var(--ink-2); font-size:1.02rem; max-width:60ch}

.field{display:flex; flex-direction:column; gap:6px}
.field label{font-size:.8rem; font-weight:600; color:var(--muted); letter-spacing:.02em}
.input{width:100%; padding:11px 13px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--surface-2); color:var(--ink); transition:.15s}
.input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-wash)}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 20px; border-radius:var(--radius-sm); border:1px solid transparent; background:var(--accent); color:#fff; font-weight:600; font-size:.95rem; transition:.15s; box-shadow:var(--shadow)}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5; cursor:not-allowed; filter:none}
.btn.gold{background:var(--gold)}
.btn.neutral{background:var(--surface); color:var(--ink); border-color:var(--line)}
.btn.neutral:hover{border-color:var(--accent)}
.btn.big{padding:15px 26px; font-size:1.05rem}
.btn.wide{width:100%}

.choices{display:grid; gap:14px}
.choice{position:relative; text-align:left; padding:18px 18px 16px; border-radius:var(--radius); border:1.5px solid var(--line); background:var(--surface-2); transition:.16s; display:flex; flex-direction:column; gap:5px}
.choice:hover{border-color:var(--accent); transform:translateY(-1px)}
.choice.sel{border-color:var(--accent); background:var(--accent-wash); box-shadow:0 0 0 3px var(--accent-wash)}
.choice.sel.coop{border-color:var(--good); background:var(--good-wash); box-shadow:0 0 0 3px var(--good-wash)}
.choice.sel.defect{border-color:var(--bad); background:var(--bad-wash); box-shadow:0 0 0 3px var(--bad-wash)}
.choice .ttl{font-weight:700; font-size:1.06rem; color:var(--ink)}
.choice .desc{font-size:.86rem; color:var(--muted)}
.choice .tag{position:absolute; top:14px; right:14px; font-size:.68rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}

.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px; background:var(--line-2); border-radius:var(--radius); overflow:hidden; border:1px solid var(--line)}
.stat{background:var(--surface); padding:16px 18px; display:flex; flex-direction:column; gap:3px}
.stat .k{font-size:.74rem; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); font-weight:600}
.stat .v{font-size:1.7rem; font-weight:600; font-family:"Fraunces",serif; letter-spacing:-.02em; line-height:1.05}
.stat .v.mono{font-family:"IBM Plex Mono",monospace; font-size:1.5rem}
.stat .note{font-size:.76rem; color:var(--faint)}
.stat.hl .v{color:var(--gold)}
.stat.good .v{color:var(--good)} .stat.bad .v{color:var(--bad)}

.grid2{display:grid; grid-template-columns:1fr 1fr; gap:18px}
.grid-analysis{display:grid; grid-template-columns:1.15fr .85fr; gap:20px; align-items:start}
@media(max-width:800px){.grid2,.grid-analysis{grid-template-columns:1fr}}

.chart-card{background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius); padding:18px}
.chart-card h3{font-size:1rem; margin-bottom:4px}
.chart-card .cap{font-size:.8rem; color:var(--muted); margin-bottom:12px}
svg{display:block; width:100%; height:auto; overflow:visible}

.note-box{border-left:3px solid var(--gold); background:var(--gold-wash); padding:12px 16px; border-radius:0 var(--radius-sm) var(--radius-sm) 0; font-size:.9rem; color:var(--ink-2)}
.note-box.teal{border-color:var(--accent); background:var(--accent-wash)}
.note-box b{color:var(--ink)}

.matrix{border-collapse:separate; border-spacing:0; width:100%; font-size:.9rem}
.matrix td,.matrix th{border:1px solid var(--line); padding:12px 10px; text-align:center}
.matrix th{background:var(--surface-2); color:var(--muted); font-weight:600; font-size:.78rem; letter-spacing:.03em}
.matrix .cell{font-family:"IBM Plex Mono",monospace; font-weight:500}
.matrix .nash{background:var(--bad-wash)} .matrix .pareto{background:var(--good-wash)}
.matrix .played{outline:2px solid var(--accent); outline-offset:-2px}

.console{display:grid; grid-template-columns:290px 1fr; gap:20px; align-items:start}
@media(max-width:820px){
  .console{grid-template-columns:1fr}
  /* On phones the setup rail is long; show the live main panel (Session/Round/results)
     first and let the rail follow. Sticky is pointless in one column. */
  .console>.rail{position:static; order:2}
}
.rail{position:sticky; top:16px; display:flex; flex-direction:column; gap:14px}
.rail-sec{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow)}
.rail-sec h3{font-size:.8rem; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); font-weight:600; margin-bottom:12px}
.game-pick{display:flex; flex-direction:column; gap:8px}
.gp{display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--surface-2); text-align:left; transition:.14s; width:100%}
.gp:hover{border-color:var(--accent)}
.gp.on{border-color:var(--accent); background:var(--accent-wash)}
.gp .n{font-weight:600; font-size:.9rem; color:var(--ink)}
.gp .d{font-size:.74rem; color:var(--muted)}
.gp .ic{width:26px;height:26px;flex:none;border-radius:7px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:.8rem;color:var(--accent-ink)}
/* Interactive-lesson tile — gold shade to set it apart from the teal game tiles.
   NB: use `.gp.il` (not `.lesson`) — `.lesson` is the full-screen overlay class and
   would otherwise position:fixed this tile over the whole page. */
.gp.il{background:var(--gold-wash); border-color:color-mix(in srgb,var(--gold) 42%,var(--line))}
.gp.il:hover{border-color:var(--gold)}
.gp.il .ic{color:var(--gold); border-color:color-mix(in srgb,var(--gold) 42%,var(--line))}
.gp-div{font-size:.66rem; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); font-weight:700; margin:4px 2px 0}
.rowbtns{display:flex; gap:8px; flex-wrap:wrap}
.seg{display:flex; align-items:center; gap:8px}
.actionbar{display:flex; flex-wrap:wrap; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px; box-shadow:var(--shadow)}
.actionbar .ab-grp{display:flex; align-items:center; gap:8px}
.actionbar .ab-spacer{flex:1 1 12px}
.actionbar .btn{padding:9px 16px; font-size:.9rem; box-shadow:none}
.actionbar .rnum{font-family:"IBM Plex Mono",monospace; font-weight:700; font-size:1.05rem; min-width:1.2em; text-align:center}
.actionbar .ab-clear{margin-left:2px; color:var(--muted); font-size:.8rem}
.tablescroll{max-height:clamp(240px,52vh,460px); overflow:auto}
.tablescroll .matrix th{position:sticky; top:0; z-index:1}
/* Coordination game (focal points). */
.coord-rules{background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px 14px; margin-top:16px}
.coord-rule{font-size:.86rem; color:var(--ink-2); padding:2px 0 2px 16px; position:relative}
.coord-rule::before{content:"›"; position:absolute; left:2px; color:var(--accent); font-weight:700}
.coord-opts{display:grid; grid-template-columns:1fr 1fr; gap:12px; max-width:420px}
.coord-opts.seq{grid-template-columns:1fr 1fr 1fr}
.coord-opt{padding:18px 12px; border-radius:var(--radius-sm); border:2px solid var(--line); background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-weight:700; font-size:1.15rem; letter-spacing:.06em; transition:.14s}
.coord-opt:hover{border-color:var(--accent)}
.coord-opt.sel{border-color:var(--accent); background:var(--accent-wash); color:var(--accent-ink)}
.coord-sq{display:grid; grid-template-columns:1fr 1fr; gap:6px; width:min(70vw,220px); aspect-ratio:1}
.coord-sq .sqcell{border:2px solid var(--line); border-radius:8px; background:#6f9e93; cursor:pointer; transition:.14s; display:grid; place-items:center; min-height:0}
.coord-sq .sqcell.odd{background:#d97b3f}
.coord-sq .sqcell:hover{outline:3px solid var(--accent); outline-offset:-3px}
.coord-sq .sqcell.sel{outline:4px solid var(--ink); outline-offset:-4px}
.coord-sq.res .sqcell{background:color-mix(in srgb,var(--accent) calc(var(--fill,0.1)*100%), var(--surface-2)); cursor:default}
.coord-sq.res .sqcell.odd{background:color-mix(in srgb,var(--gold) calc(var(--fill,0.1)*100%), var(--surface-2))}
.coord-sq .sqn{font-family:"IBM Plex Mono",monospace; font-weight:700; font-size:1.3rem; color:var(--ink)}
.coord-prog{display:flex; align-items:center; gap:6px; margin-top:8px}
.cdot{width:10px; height:10px; border-radius:50%; background:var(--line); transition:.2s}
.cdot.on{background:var(--accent)}
.coord-summary{margin-top:14px; display:flex; flex-direction:column; gap:6px; max-width:440px}
.coord-srow{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:9px 13px; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-sm)}
.coord-srow .cq{color:var(--muted); font-size:.85rem}
.coord-srow .ca{font-weight:700; font-family:"IBM Plex Mono",monospace; color:var(--accent-ink)}
@media(max-width:520px){ .coord-opts.seq{grid-template-columns:1fr 1fr} }
/* Pair card games (Red vs Black, Quatro Uno) — inline-SVG card faces, tap to record */
.cardbtn{padding:0; border:none; background:transparent; cursor:pointer; line-height:0; border-radius:10px; transition:transform .1s}
.cardbtn:hover{transform:translateY(-3px)}
.cardbtn:active{transform:translateY(-1px)}
.cardbtn .cf{filter:drop-shadow(0 2px 5px rgba(0,0,0,.2))}
.card-rail{display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin:10px 0}
.card-rail.small{gap:8px; margin:0}
.cardbtn.q{position:relative}
.cardbtn.q.used .cf{opacity:.38}
.q-pos{position:absolute; top:-6px; right:-6px; background:var(--accent); color:#fff; font-size:.72rem; font-weight:700; width:19px; height:19px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:"IBM Plex Mono",monospace}
.q-reset{width:44px; height:60px; border:1px dashed var(--line); border-radius:10px; background:transparent; color:var(--muted); font-size:1.2rem; cursor:pointer}
.q-round{background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:12px; display:flex; flex-direction:column; gap:8px}
.colorpick{margin-top:14px}
.colbtn{padding:10px 20px; border:2px solid var(--line); border-radius:10px; background:var(--surface); font-weight:700; font-size:1rem; cursor:pointer}
.colbtn.sel.red{border-color:#d21f3c; color:#d21f3c; background:rgba(210,31,60,.09)}
.colbtn.sel.black{border-color:var(--ink); color:var(--ink); background:var(--surface-2)}
.rtap-prog{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin:12px 0 2px}
.rtap-strip{display:flex; flex-wrap:wrap; gap:5px; margin-top:12px}
.rtap-slot{position:relative; width:34px; height:47px; border:1px solid var(--line); border-radius:6px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; overflow:hidden}
.rtap-slot.active{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-wash)}
.rtap-slot.filled{background:transparent}
.rtap-slot .rtap-n{position:absolute; top:1px; left:3px; font-size:.58rem; color:var(--faint); font-family:"IBM Plex Mono",monospace; z-index:1}
.cf.mini{width:100%; height:100%}
.pair-pick{background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:6px}
.pair-search{width:100%; margin-top:6px}
.pair-list{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.pair-name{padding:6px 12px; border:1px solid var(--line); border-radius:999px; background:var(--surface); font-weight:600; font-size:.85rem; cursor:pointer}
.pair-name:hover{border-color:var(--accent); color:var(--accent-ink)}
.pair-chosen{display:flex; align-items:center; gap:10px; margin-top:6px; font-weight:700; color:var(--good)}
.linkbtn{background:none; border:none; color:var(--accent-ink); text-decoration:underline; cursor:pointer; font-size:.82rem; font-weight:600}
.jmx{border-collapse:collapse; width:100%; font-family:"IBM Plex Mono",monospace; font-size:.82rem; margin-top:6px}
.jmx th,.jmx td{border:1px solid var(--line); padding:6px 4px; text-align:center}
.jmx th{background:var(--surface-2); color:var(--ink-2); font-weight:700}
.jmx th.cn{font-size:.66rem; color:var(--muted); font-weight:600}
.jmx td{color:var(--ink)}
.pair-name.bot{border-style:dashed; color:var(--ink-2)}
.pair-live{background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px 12px; margin-top:14px}
.pair-live-head{display:flex; align-items:center; gap:10px; margin-bottom:8px}
.pill-live{font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--accent-ink); background:var(--accent-wash); padding:2px 8px; border-radius:999px}
.mini-row{display:flex; flex-wrap:wrap; gap:4px}
.mini-slot{width:26px; height:36px; border-radius:5px; overflow:hidden; display:inline-flex}
.mini-slot.empty{border:1px dashed var(--line); background:transparent}
.q-oppline{display:flex; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap}
/* Full-screen "collection" view projected to the class while submissions are open —
   participation only, never results, so it can't leak the answer. */
.present{position:fixed; inset:0; z-index:60; background:var(--bg); color:var(--ink);
  display:flex; flex-direction:column; padding:clamp(18px,3.5vw,44px); gap:clamp(14px,2.5vh,26px); overflow:auto}
.present-head{display:flex; flex-direction:column; gap:2px; text-align:center}
.present-course{font-size:.8rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:700}
.present-game{font-family:"Fraunces",serif; font-size:clamp(1.6rem,4vw,2.8rem); font-weight:600; line-height:1.05}
.present-meta{font-size:clamp(.85rem,1.6vw,1.05rem); color:var(--ink-2); font-weight:600}
.present-body{flex:1; display:flex; align-items:center; justify-content:center; gap:clamp(24px,5vw,72px); flex-wrap:wrap}
.present-count{display:flex; flex-direction:column; align-items:center; gap:6px}
.present-status{display:inline-flex; align-items:center; gap:10px; font-size:clamp(1rem,2vw,1.4rem); font-weight:700; letter-spacing:.02em; color:var(--muted); text-transform:uppercase}
.present-status.live{color:var(--accent-ink)}
.present-status .dot{width:.7em; height:.7em; border-radius:50%; background:var(--muted)}
.present-status.live .dot{background:var(--accent); animation:presentPulse 1.4s ease-in-out infinite}
@keyframes presentPulse{0%,100%{opacity:1; transform:scale(1)} 50%{opacity:.35; transform:scale(.78)}}
.present-num{font-family:"IBM Plex Mono",monospace; font-weight:700; font-size:clamp(4.5rem,20vw,13rem); line-height:.95; color:var(--accent-ink)}
.present-numlabel{font-size:clamp(1rem,2.2vw,1.5rem); color:var(--ink-2); font-weight:600; margin-top:-4px}
.present-prog{width:min(58vw,420px); height:12px; background:var(--surface-2); border:1px solid var(--line); border-radius:99px; overflow:hidden; margin-top:12px}
.present-prog>span{display:block; height:100%; background:var(--accent); transition:width .4s ease}
.present-qr{display:flex; flex-direction:column; align-items:center; gap:12px}
.present-qr .qrbox{background:#fff; padding:clamp(10px,1.5vw,18px); border-radius:14px; box-shadow:var(--shadow); width:clamp(180px,26vw,320px)}
.present-qr .qrbox svg{display:block; width:100%; height:auto}
.present-qr .qrcap{font-size:clamp(.95rem,1.8vw,1.2rem); font-weight:700; color:var(--ink)}
.present-controls{display:flex; flex-wrap:wrap; gap:12px; justify-content:center; align-items:center}
.present-controls .btn{padding:14px 26px; font-size:1.05rem}
/* Pareto-optimality interactive lesson (instructor-projected, no submissions). */
.lesson{position:fixed; inset:0; z-index:60; background:var(--bg); color:var(--ink); overflow:auto;
  display:flex; flex-direction:column; padding:clamp(16px,3vw,40px); gap:clamp(12px,2vh,22px)}
.lesson-head{display:flex; flex-direction:column; gap:2px; text-align:center}
.lesson-eyebrow{font-size:.8rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:700}
.lesson-title{font-family:"Fraunces",serif; font-size:clamp(1.5rem,3.4vw,2.4rem); font-weight:600}
.lesson-body{flex:1; display:flex; gap:clamp(20px,4vw,56px); align-items:flex-start; justify-content:center; flex-wrap:wrap}
.lesson-left{display:flex; flex-direction:column; align-items:center; gap:14px}
.pmatrix{border-collapse:separate; border-spacing:0; font-family:"IBM Plex Mono",monospace}
.pmatrix th{font-family:"IBM Plex Sans",sans-serif; font-weight:600; font-size:.82rem; color:var(--muted); padding:8px 10px; text-align:center}
.pmatrix .corner{background:transparent}
.pmatrix .rowlab{writing-mode:vertical-rl; transform:rotate(180deg); color:var(--accent-ink)}
.pmatrix .collab{color:var(--accent-ink)}
.pcell{position:relative; width:clamp(96px,15vw,150px); height:clamp(84px,13vw,132px); border:2px solid var(--line);
  background:var(--surface); cursor:pointer; transition:.15s; text-align:center; vertical-align:middle; padding:6px}
.pcell:hover{border-color:var(--accent); box-shadow:var(--shadow)}
.pcell .pay{font-size:clamp(1.2rem,2.6vw,1.9rem); font-weight:700; line-height:1.15}
.pcell .pa{color:var(--accent-ink)} .pcell .pb{color:var(--gold)}
.pcell .plabel{font-family:"IBM Plex Sans",sans-serif; font-size:.66rem; color:var(--muted); margin-top:3px}
.pcell.cand{border-color:var(--ink); box-shadow:0 0 0 3px var(--ink) inset}
.pcell.better{border-color:var(--good); background:var(--good-wash)}
.pcell.better::after{content:"▲ better for both / no worse"; position:absolute; left:0; right:0; bottom:-16px; font-family:"IBM Plex Sans",sans-serif; font-size:.6rem; color:var(--good); font-weight:700}
.pcell.dominated{opacity:.85}
.pcell.dominated .pay{text-decoration:line-through; text-decoration-color:var(--bad); text-decoration-thickness:2px}
.pcell.optimal{border-color:var(--good); box-shadow:0 0 0 4px var(--good-wash), 0 0 0 6px var(--good)}
.pcell .stamp{position:absolute; top:4px; right:6px; font-family:"IBM Plex Sans",sans-serif; font-size:.62rem; font-weight:800; letter-spacing:.04em; text-transform:uppercase}
.pcell.dominated .stamp{color:var(--bad)} .pcell.optimal .stamp{color:var(--good)}
.pcell input{width:2.6em; font:inherit; font-size:1rem; text-align:center; border:1px solid var(--line); border-radius:6px; background:var(--surface-2); color:var(--ink); padding:2px}
.lesson-right{max-width:420px; min-width:min(92vw,320px); display:flex; flex-direction:column; gap:14px}
.pstep{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow)}
.pstep h4{margin:0 0 6px; font-size:.78rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.pstep .pstep-txt{font-size:1rem; line-height:1.5}
.pstep .verdict{font-weight:700; font-size:1.05rem}
.pstep .verdict.no{color:var(--bad)} .pstep .verdict.yes{color:var(--good)}
.pminimap{margin-top:2px}
.lesson-ctr{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:center}
.pset-row{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}
.pset-row .ghost-btn.on{border-color:var(--accent); color:var(--accent-ink); background:var(--accent-wash)}
@media(max-width:520px){ .actionbar .btn,.actionbar .ghost-btn{flex:1 1 auto} }
.count-big{font-family:"Fraunces",serif; font-size:2.4rem; font-weight:600; line-height:1}

.tinylabel{font-size:.76rem; color:var(--muted); font-weight:600}
.center{text-align:center}
.stack{display:flex; flex-direction:column; gap:16px}
.row{display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.spread{justify-content:space-between}
.divider{height:1px; background:var(--line-2); margin:4px 0}
.mut{color:var(--muted)} .sm{font-size:.85rem}

.setup-wrap{max-width:640px; margin:4vh auto 0}
.paramgrid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:.78rem; color:var(--muted); margin-top:10px}
.legc{display:inline-flex; align-items:center; gap:6px}
.swatch{width:11px;height:11px;border-radius:3px}
.steps{counter-reset:s; display:flex; flex-direction:column; gap:14px; margin-top:8px}
.step{display:flex; gap:12px}
.step .num{counter-increment:s; flex:none; width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.85rem}
.step .num::before{content:counter(s)}
.step .body{font-size:.92rem; color:var(--ink-2); padding-top:2px}
.step .body b{color:var(--ink)}

.toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--bg); padding:11px 20px; border-radius:999px; font-size:.88rem; font-weight:500; box-shadow:var(--shadow-lg); opacity:0; transition:.25s; pointer-events:none; z-index:50}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
.badge{font-size:.7rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:3px 8px; border-radius:6px; background:var(--accent-wash); color:var(--accent-ink)}
.myval{font-family:"IBM Plex Mono",monospace; font-weight:600; color:var(--accent-ink)}
textarea.input{resize:vertical; min-height:96px; line-height:1.45; width:100%}
.gbtn{display:inline-flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:12px 18px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--surface); color:var(--ink); font-weight:600; font-size:.95rem; transition:.15s; box-shadow:var(--shadow)}
.gbtn:hover{border-color:var(--accent)}
.gbtn .g{width:18px;height:18px;flex:none}
.orline{display:flex; align-items:center; gap:12px; color:var(--faint); font-size:.78rem; margin:16px 0; text-transform:uppercase; letter-spacing:.1em}
.orline::before,.orline::after{content:""; height:1px; background:var(--line); flex:1}
.chips{display:flex; flex-wrap:wrap; gap:7px}
.chip{font-size:.8rem; font-weight:600; padding:4px 10px; border-radius:999px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); display:inline-flex; align-items:center; gap:6px}
.chip.done{color:var(--good); border-color:color-mix(in srgb,var(--good) 40%,var(--line)); background:var(--good-wash)}
.chip.todo{color:var(--muted)}
.chip.guest{color:var(--gold); border-color:color-mix(in srgb,var(--gold) 45%,var(--line)); background:var(--gold-wash)}
.pickprompt{font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:1.15rem; color:var(--ink); margin:22px 0 12px}
.picks{display:grid; grid-template-columns:1fr 1fr; gap:14px}
@media(max-width:520px){.picks{grid-template-columns:1fr}}
.pick{position:relative; text-align:left; padding:20px 18px 16px; border-radius:var(--radius); border:2px solid var(--line); background:var(--surface-2); transition:.16s; display:flex; flex-direction:column; gap:6px}
.pick .ttl{font-weight:800; font-size:1.25rem; color:var(--ink)}
.pick .desc{font-size:.86rem; color:var(--muted)}
.pick .tag{position:absolute; top:14px; right:14px; font-size:.66rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; opacity:.85}
.pick:hover{transform:translateY(-2px); box-shadow:var(--shadow-lg)}
.pick:active{transform:translateY(0)}
.pick.teal{border-color:var(--accent); background:var(--accent-wash)} .pick.teal .ttl{color:var(--accent-ink)}
.pick.gold{border-color:var(--gold); background:var(--gold-wash)} .pick.gold .ttl{color:var(--gold)}
.pick.teal.sel{background:var(--accent); border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-wash)}
.pick.gold.sel{background:var(--gold); border-color:var(--gold); box-shadow:0 0 0 3px var(--gold-wash)}
.pick.sel .ttl,.pick.sel .desc,.pick.sel .tag{color:#fff; opacity:1}
.footer{text-align:center; color:var(--faint); font-size:.78rem; line-height:1.5; padding:30px 12px 0}
.footer b{color:var(--muted); font-weight:600}
.submail{font-size:.72rem; color:var(--muted); font-family:"IBM Plex Mono",monospace; margin-top:2px; word-break:break-all; font-weight:400}
.whowrap{display:flex; flex-wrap:wrap; gap:8px}
.who{border:1px solid var(--line); background:var(--surface-2); border-radius:10px; padding:7px 11px 8px; min-width:0}
.who-name{font-weight:600; font-size:.85rem; color:var(--ink-2)}
.who-mail{font-size:.72rem; color:var(--muted); font-family:"IBM Plex Mono",monospace; margin-top:1px; word-break:break-all}
.who.done{border-color:color-mix(in srgb,var(--good) 40%,var(--line)); background:var(--good-wash)} .who.done .who-name{color:var(--good)}
.who.todo .who-name{color:var(--muted)}
.who.guest{border-color:color-mix(in srgb,var(--gold) 45%,var(--line)); background:var(--gold-wash)} .who.guest .who-name{color:var(--gold)}
</style>
</head>

/* One room per class (course + year), e.g. "pgp-2026". It comes from the ?class=
   URL parameter, so different cohorts run from different share links with no code
   change. Defaults to "main" (the original room) when no ?class is given, so old
   links keep working. All of a class's sessions, roster and data live under it. */
/* The class/course id from ?class=<id>. A bare link (no param) falls back to "main"
   and, for signed-in students, triggers enrollment-based auto-routing to their course. */
const CLASS_PARAM = (function(){
  try{ const p=new URLSearchParams(location.search).get("class"); if(p){ const c=p.replace(/[^A-Za-z0-9_-]/g,"").slice(0,60); if(c) return c; } }catch(e){}
  return null;
})();
const ROOM = CLASS_PARAM || "main";
const HAS_CLASS_PARAM = CLASS_PARAM != null;

/* Instructor allowlist. Any Google account whose email is listed here gets the
   console straight away on sign-in — no passcode. Add EVERY instructor's Google
   address BEFORE publishing the strict Firebase rules, or they'll be locked out
   of their own class. */
const INSTRUCTOR_EMAILS = [
  "ankit.khandelwal@gmail.com",
  "sonia@iiml.ac.in"
];
/* Flip to true ONLY after the strict rules (see firebase-rules.lockdown.json) are

const REQUIRE_GOOGLE = true;
const isInstructorEmail = e => !!e && INSTRUCTOR_EMAILS.some(x=>x.toLowerCase()===String(e).toLowerCase());
/* ═══════════════════════════════════════════════════════════════════════ */

/* Instructor-panel order follows the key order here: Give or Keep (G1) first. */
const GAMES = {
  pd: { name:"Give or Keep", short:"G1", icon:"G1",
    blurb:"Keep money for yourself, or give more to your partner." },
  guess23: { name:"Guess ½ of the Average", short:"G2", icon:"G2",
    blurb:"Pick a number; target is a fraction of the class mean." },
  coord: { name:"Coordination", short:"G3", icon:"G3",
    blurb:"Match the class without talking — 4 quick focal-point questions." },
  publicgoods: { name:"Public Goods", short:"G4", icon:"G4",
    blurb:"Contribute to a shared fund that pays everyone." },
  quatro: { name:"Simultaneous Quatro Uno", short:"G5", icon:"G5",
    blurb:"Card duel with your neighbour — tap your own pile each hand." },
  redblack: { name:"Red vs Black", short:"G6", icon:"G6",
    blurb:"Card duel with your neighbour — tap the card you played each hand." }

const DEFAULT_CONFIG = {
  guess23:{ frac:1/2, min:0, max:100, step:0.5 },
  pd:{ keep:2, give:3 },
  coord:{ pot:100 },
  quatro:{ rounds:5 },
  redblack:{ rounds:20 },
  publicgoods:{ E:8, mult:1.5 }
};
/* The four coordination questions, answered back-to-back in ONE submission (no rounds).

   play is meant to be instant, so students can't go back and change earlier answers.
   Each question stores into its own field (c1..c4) on the single sub doc. */
const COORD_QS = [
  { field:"c1", key:"coin", title:"Heads or Tails?", prompt:"Pick Heads or Tails so you match everyone else.",
    options:[{v:"heads",l:"Heads"},{v:"tails",l:"Tails"}], focal:"heads" },
  { field:"c2", key:"seq", title:"Arrange A, B, C", prompt:"Put A, B and C in some order — the same order everyone else will pick.",

  { field:"c4", key:"split", title:"Split $100", prompt:"Write your claim of a $100 pot. If two claims add to $100 or less, both are paid; if they exceed $100, both get nothing.",
    focal:50, num:true }
];

const $ = s => document.querySelector(s);
const el = (t,c,txt)=>{const e=document.createElement(t); if(c)e.className=c; if(txt!=null)e.textContent=txt; return e;};
const fmt = (n,d=1)=> (n==null||isNaN(n))?"—":Number(n).toLocaleString(undefined,{maximumFractionDigits:d,minimumFractionDigits:0});
const pct = n => (n==null||isNaN(n))?"—":Math.round(n*100)+"%";
function hash(str){let h=5381; for(let i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))>>>0; return h.toString(36);}

function ls(k,v){try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){ return null; }}

/* Identity: a student is either signed in with Google (authUser) or joined
   manually with a typed name (manualId + gtl_name). `myId`/`myName` are the
   *effective* identity, recomputed by applyIdentity() on every render. */
let manualId = ls("gtl_id");
if(!manualId){ manualId = "s_"+Math.random().toString(36).slice(2,9); ls("gtl_id",manualId); }
let myId = manualId;
let myName = ls("gtl_name") || "";
let meGuest = false;
/* Firebase keys can't contain . # $ [ ] / — percent-encode them so an email
   works as a path segment. Random ids and roll numbers pass through unchanged. */
function encodeKey(s){ return String(s).replace(/[.#$\[\]\/]/g, c=>"%"+c.charCodeAt(0).toString(16)); }

(function initTheme(){
  const saved = ls("gtl_theme");
  if(saved) document.documentElement.setAttribute("data-theme",saved);
  $("#themeBtn").onclick=()=>{
    const cur = document.documentElement.getAttribute("data-theme");
    const isDark = cur ? cur==="dark" : matchMedia("(prefers-color-scheme:dark)").matches;
    const next = isDark?"light":"dark";
    document.documentElement.setAttribute("data-theme",next); ls("gtl_theme",next);
  };
})();

/* ═══════════════════════ state + data layer (Firebase) ═══════════════════════ */
let fb=null, fbAuth=null, authUser=null, control=null, controlLoaded=false, allSubs={}, subs=[], curKey=null;

let authResolved=false, listenersOn=false, authSlow=false;

const curSession = ()=> (control&&control.session)||1;

const curMSection = ()=>{
  const s=((control&&control.section)||"").toUpperCase();
  if(s) return s;
  const secs=rosterSections();
  return secs.length ? secs[0] : "";
};
const roundKey = (g,r)=> "S"+curSession()+curMSection()+"-"+g+"-"+r;         // e.g. "S1A-pd-1" or "S1-pd-1"
const CTRL_PATH = ()=> ROOM+"/control";
const SUBS_PATH = ()=> ROOM+"/subs";

const ENROLL_DOC = email => "enroll/"+encodeKey(String(email).toLowerCase());   // enroll/<email> = {<courseId>:true}

function applyIdentity(){
  if(authUser){
    const email=(authUser.email||"").toLowerCase();
    const rn=roster[email];
    myId=email; myName=(rn&&rn.name)||authUser.displayName||email;
    meGuest = !rn;                       // enrolled only if the email is on the roster
  } else {
    myId=manualId; myName=ls("gtl_name")||""; meGuest = !!myName;  // a typed name is always a guest
  }
}
function haveIdentity(){ return !!authUser || !!myName; }

function configMissing(){ return !FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.indexOf("PASTE")===0 || FIREBASE_CONFIG.databaseURL.indexOf("PASTE")>-1; }

function recompute(){
  curKey = control && control.activeGame ? roundKey(control.activeGame,control.round) : null;
  subs = curKey ? Object.values(allSubs).filter(s=>s && s.roundKey===curKey) : [];
}

function boot(){
  if(typeof firebase==="undefined"){ renderSdkError(); return; }
  if(configMissing()){ renderSetup(); return; }
  try{
    firebase.initializeApp(FIREBASE_CONFIG); fb = firebase.database();
  }catch(e){ renderSetup(e); return; }
  /* Google sign-in — optional. Works once the instructor enables the Google
     provider and authorizes this domain in the Firebase console. If the auth
     SDK is absent or setup isn't done, the app still runs with name-join. */
  try{
    if(firebase.auth){
      fbAuth=firebase.auth();
      /* Sign-in-first (Option A): under REQUIRE_GOOGLE the database listeners attach
         only once a user is signed in, and detach on sign-out — so nothing is read
         (and nothing is shown) until authentication, and the rules can require auth. */
      fbAuth.onAuthStateChanged(u=>{
        authUser=u; authResolved=true; applyIdentity();
        if(REQUIRE_GOOGLE){ if(u) attachData(); else detachData(); }
        render();
      });
      fbAuth.getRedirectResult().catch(()=>{});
    }
  }catch(e){ fbAuth=null; }
  if(REQUIRE_GOOGLE && !fbAuth) authResolved=true;   // can't sign in — show the (unavailable) sign-in screen, not a spinner
  if(!REQUIRE_GOOGLE) attachData();                   // legacy/open mode: read immediately, name-join allowed
  // If auth restore stalls (slow mobile connection), stop showing a bare spinner and
  // offer a reload after a few seconds. onAuthStateChanged still resolves it if it arrives.
  setTimeout(()=>{ if(!authResolved){ authSlow=true; render(); } }, 7000);
  render();
}
/* control/subs/roster live data — attached/detached around authentication under Option A. */
function onCtrl(snap){ control = snap.exists()?snap.val():null; controlLoaded=true; recompute(); render(); }
function onSubs(snap){ allSubs = snap.val()||{}; recompute(); render(); }
function onRoster(snap){ setRoster(snap.val()); render(); }
function onCourses(snap){ courses = snap.val()||{}; render(); }
function onEnroll(snap){ enroll = snap.val()||{}; maybeAutoRoute(); render(); }
function attachData(){
  if(listenersOn) return; listenersOn=true;
  fb.ref(CTRL_PATH()).on("value", onCtrl, err=>{ console.warn("control",err); renderRulesError(); });
  fb.ref(SUBS_PATH()).on("value", onSubs, err=>{ console.warn("subs",err); });
  fb.ref(ROSTER_PATH()).on("value", onRoster, err=>{ console.warn("roster",err); });
  fb.ref(COURSES_PATH).on("value", onCourses, err=>{ console.warn("courses",err); });
  if(authUser&&authUser.email) fb.ref(ENROLL_DOC(authUser.email)).on("value", onEnroll, err=>{ console.warn("enroll",err); });
}
function detachData(){
  if(!listenersOn) return; listenersOn=false;
  try{ fb.ref(CTRL_PATH()).off(); fb.ref(SUBS_PATH()).off(); fb.ref(ROSTER_PATH()).off(); fb.ref(COURSES_PATH).off(); }catch(e){}
  control=null; controlLoaded=false; allSubs={}; roster={}; rosterList=[]; courses={}; enroll={}; recompute();
}
/* My enrolled course ids, from the enrollment index (signed-in students only). */
function myCourses(){ return enroll && typeof enroll==="object" ? Object.keys(enroll).filter(k=>enroll[k]) : []; }
/* On a bare link (no ?class=), send a signed-in student to their course:
   exactly one enrolment → redirect; several → a picker (rendered in render()); none → stay as guest. */
function maybeAutoRoute(){
  if(routed || HAS_CLASS_PARAM || isTeacher() || !authUser) return;
  const mine=myCourses();
  if(mine.length===1 && mine[0] && mine[0]!=="main"){
    routed=true;
    try{ location.search="?class="+encodeURIComponent(mine[0]); }catch(e){}
  }
}

async function writeControl(patch){
  try{
    const ref = fb.ref(CTRL_PATH());
    const cur = await ref.once("value");
    if(cur.exists()) await ref.update(patch);
    else await ref.set(Object.assign({createdAt:Date.now()},patch));
    return true;
  }catch(e){ toast("Couldn't update — check your connection"); return false; }
}
function cfg(game){ return Object.assign({}, DEFAULT_CONFIG[game], (control&&control.config&&control.config[game])||{}); }

async function submit(payload){
  const key=roundKey(control.activeGame,control.round);
  const doc={ roundKey:key, session:curSession(), game:control.activeGame, round:control.round, studentId:myId, name:myName||"Anon", ts:Date.now() };
  if(meGuest) doc.guest=true;
  if(authUser&&authUser.email) doc.email=authUser.email.toLowerCase();
  if(curMSection()) doc.msection=curMSection();   // the section this meeting is running
  const rn=roster[String(myId).toLowerCase()];    // stamp roster fields for later analysis/export
  if(rn){ if(rn.sid)doc.sid=rn.sid; if(rn.area)doc.area=rn.area; if(rn.section)doc.section=rn.section; }
  Object.assign(doc,payload);
  try{ await fb.ref(SUB_DOC(key,myId)).set(doc); }
  catch(e){ toast("Submit failed — check connection"); return; }
  // The student's OWN submission must always refresh the screen (show the confirmation),
  // even though the re-render guard skips updates while an input is focused. Blur the
  // field (closes the mobile keyboard) and force a re-render past the guard.
  try{ const a=document.activeElement; if(a&&a.blur) a.blur(); }catch(_){}
  lastViewKey=null; render();
}

/* A submission counts as "in" once done!==false. Older games never set done, so
   they are always done; the pair card games write done:false while still tapping. */
function isDone(s){ return !!s && s.done!==false; }
function oppColor(c){ return c==="red"?"black":"red"; }
/* Pair card games write their sub incrementally so a partner can watch it fill in

function pairDoc(payload, done){

function botRBSeq(R){ const pool=["K","K","A","2","3"]; const out=[]; for(let i=0;i<R;i++) out.push(pool[Math.floor(Math.random()*5)]); return out; }  // ~K 40% / A·2·3 20%
function botPiles(R){ const out=[]; for(let i=0;i<R;i++){ const a=[1,2,3,4]; for(let k=3;k>0;k--){ const j=Math.floor(Math.random()*(k+1)); const t=a[k];a[k]=a[j];a[j]=t; } out.push(a.join("")); } return out; }

async function clearRound(){
  if(!control||!control.activeGame) return;
  const key=roundKey(control.activeGame,control.round);
  for(const s of subs.slice()){ try{ await fb.ref(SUB_DOC(key,s.studentId)).remove(); }catch(e){} }
  toast("Round data cleared");
}

async function writeRoster(list){
  try{
    await fb.ref(ROSTER_PATH()).set(list);
    // Register this course in the global picker and index each email→course for auto-routing.
    try{ if(!courses[ROOM]) await fb.ref(COURSES_PATH+"/"+ROOM).update({name:(courses[ROOM]&&courses[ROOM].name)||ROOM, createdAt:Date.now()}); }catch(e){}
    try{ const up={}; list.forEach(e=>{ if(e.email) up[encodeKey(String(e.email).toLowerCase())+"/"+ROOM]=true; }); if(Object.keys(up).length) await fb.ref("enroll").update(up); }catch(e){}
    return true;
  }catch(e){ toast("Couldn't save roster"); return false; }
}
/* Create/register a course in the global registry, then open it. */
async function createCourse(id,name){
  id=String(id||"").replace(/[^A-Za-z0-9_-]/g,"").slice(0,60); if(!id) return false;
  try{ await fb.ref(COURSES_PATH+"/"+id).update({name:name||id, createdAt:Date.now()}); }catch(e){ toast("Couldn't create course"); return false; }
  try{ location.search="?class="+encodeURIComponent(id); }catch(e){}
  return true;
}
async function removeRoster(){ try{ await fb.ref(ROSTER_PATH()).remove(); toast("Roster cleared"); }catch(e){} }
/* Accepts a plain "email, name" list OR a spreadsheet paste with a header row
   (ID / Name / Email / Area / Section in any column order). Tabs, commas, semicolons
   or 2+ spaces separate columns, so single-spaced names stay intact. */
function parseRoster(text){
  const lines=String(text||"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return [];
  const split=l=> l.split(/\t|,|;|\s{2,}/).map(x=>x.trim());
  let cols=null, start=0;
  if(!lines[0].includes("@") && /email|name|section|\bid\b|area/i.test(lines[0])){
    cols={}; split(lines[0]).forEach((h,i)=>{ const k=h.toLowerCase();
      if(/e-?mail/.test(k)) cols.email=i; else if(/name/.test(k)) cols.name=i;
      else if(/section/.test(k)) cols.section=i; else if(/area/.test(k)) cols.area=i;
      else if(/id/.test(k)) cols.sid=i; });
    start=1;
  }
  const out=[], seen={};
  for(let li=start; li<lines.length; li++){
    const p=split(lines[li]); if(!p.length) continue;
    let email="", name="", sid="", area="", section="";
    if(cols && cols.email!=null){
      email=(p[cols.email]||""); name=cols.name!=null?p[cols.name]:"";
      sid=cols.sid!=null?p[cols.sid]:""; area=cols.area!=null?p[cols.area]:""; section=cols.section!=null?p[cols.section]:"";
    } else {
      const ei=p.findIndex(x=>x.includes("@")); if(ei<0) continue;
      email=p[ei];
      if(p.length>=5){ sid=p[0]; name=p[1]; area=p[3]||""; section=p[4]||""; }
      else { name=p.filter((x,i)=>i!==ei).join(" "); }
    }
    email=(email||"").trim().toLowerCase(); if(!email.includes("@")) continue;
    if(seen[email]) continue; seen[email]=1;
    out.push({ email, name:(name||"").trim()||email, sid:(sid||"").trim(), area:(area||"").trim(), section:(section||"").trim().toUpperCase() });
  }
  return out;
}

/* ─── Google sign-in (student) ─── */
async function googleSignIn(){
  if(!fbAuth){ toast("Google sign-in isn't available here"); return; }
  const provider=new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({ prompt:"select_account" });
  try{ await fbAuth.signInWithPopup(provider); }
  catch(e){
    const c=e&&e.code;
    if(c==="auth/popup-blocked"||c==="auth/popup-closed-by-user"||c==="auth/cancelled-popup-request"){
      try{ await fbAuth.signInWithRedirect(provider); return; }catch(e2){ toast(googleErr(e2)); }
    } else { toast(googleErr(e)); }
  }
}
function googleErr(e){
  const c=e&&e.code||"";
  if(c==="auth/operation-not-allowed") return "Google sign-in isn't switched on yet — ask your instructor.";
  if(c==="auth/unauthorized-domain") return "This page isn't authorized for Google sign-in yet.";
  return "Google sign-in didn't complete — try again, or join with your name.";
}
async function signOutStudent(){ try{ if(fbAuth) await fbAuth.signOut(); }catch(e){} }

/* The course label shown in the header: the registered course name, else the room
   id, else the lab tagline for the default room. */
function courseName(){ return (courses[ROOM]&&courses[ROOM].name)||(ROOM&&ROOM!=="main"?ROOM:""); }
function syncBrand(){
  const s=$("#brandSub"); if(!s) return;
  const nm=courseName();

}
/* Instructor-only course switcher in the top bar. Rebuilt only when the course set
   changes, so it doesn't reset (or close) while live counts tick during a round. */
let _courseSelSig=null;
function syncCourseSel(){
  const sel=$("#courseSel"); if(!sel) return;
  const ids=Object.keys(courses).sort();
  const show = isTeacher() && ids.length>0;
  sel.hidden=!show;
  if(!show){ _courseSelSig=null; return; }
  const sig=ids.map(id=>id+":"+((courses[id]&&courses[id].name)||"")).join("|")+"||"+ROOM;
  if(sig===_courseSelSig) return;
  _courseSelSig=sig;
  sel.innerHTML="";
  if(!courses[ROOM]){ const o=document.createElement("option"); o.value=ROOM; o.textContent=ROOM+" (current)"; sel.append(o); }
  ids.forEach(id=>{ const o=document.createElement("option"); o.value=id; o.textContent=(courses[id].name||id); sel.append(o); });
  sel.value=ROOM;
  sel.onchange=()=>{ if(sel.value && sel.value!==ROOM){ try{location.search="?class="+encodeURIComponent(sel.value);}catch(e){} } };
}
/* A signature of everything that changes the STRUCTURE of the view (role, game,
   phase, round, identity…) — but NOT live counts like how many have submitted.
   Used to skip a re-render that would only refresh counts, so it can't wipe out an
   input a student is mid-way through typing (the guess box, the contribution slider). */
function viewKey(){
  return [role, unlocked, isTeacher(), authUser?authUser.email:"", myName||"", routed,
    (REQUIRE_GOOGLE&&!authUser)?"signin":"", authResolved,
    control?control.activeGame:"", control?control.phase:"", control?control.round:"",
    control?control.session:"", control?control.section:"", myCourses().length].join("|");
}
let lastViewKey=null, presentMode=false, lessonMode=null;
/* In-progress form state for the multi-field pair games (quatro/redblack), kept OUTSIDE
   the render cycle so a live re-render (a classmate submitting) can't wipe a half-filled
   form. Keyed by game+roundKey. */
let gameDraft={};
function draftFor(k){ if(!gameDraft[k]) gameDraft[k]={}; return gameDraft[k]; }
function render(){
  applyIdentity();
  syncPhasePill();
  syncBrand();
  syncCourseSel();
  const app = $("#app");
  // Instructor "collection" view — full-screen, projected to the class. Shows
  // participation only (never results), so it can't leak the answer. Available in any
  // phase (Reveal from the console exits it); only drops if the console context is gone.
  if(presentMode && !(isTeacher() && control && control.activeGame)) presentMode=false;
  if(presentMode){ app.replaceChildren(presentView()); return; }
  // Interactive lessons (no submissions/Firebase) — instructor-launched, projected.
  if(lessonMode && !isTeacher()) lessonMode=null;
  if(lessonMode==="pareto"){ app.replaceChildren(paretoLesson()); return; }
  let next;
  if(REQUIRE_GOOGLE && !authUser){
    next = authResolved ? signInLanding() : connectingScreen();
  } else if(!HAS_CLASS_PARAM && !isTeacher() && authUser && !routed && myCourses().length>1){
    // Signed-in student on the bare link, enrolled in more than one course → let them choose.
    next = coursePicker();
  } else if(!control || !control.activeGame){
    next = isTeacher() ? teacherConsole() : studentWaiting();
  } else if(isTeacher()){
    next = teacherConsole();
  } else {
    next = studentView();
  }
  // If the student/instructor is actively typing in a field and the structural view
  // hasn't changed (only a live count did), don't replace the DOM — that would blow
  // away their in-progress entry and close the mobile keyboard. This was why the
  // number-entry game (G2) felt like "the page disappeared" as classmates submitted.
  const key=viewKey();
  const ae=document.activeElement;
  const typing = ae && app.contains(ae) && (ae.tagName==="INPUT"||ae.tagName==="TEXTAREA");
  if(typing && key===lastViewKey) return;
  lastViewKey=key;
  app.replaceChildren(next);
}

function syncPhasePill(){
  const p=$("#phasePill"), t=$("#phaseTxt");
  p.className="pill";
  if(!control||!control.activeGame){ t.textContent="Waiting to start"; p.classList.add("wait"); return; }
  if(control.phase==="open"){ p.classList.add("live"); t.textContent="Submissions open · "+GAMES[control.activeGame].short+" R"+control.round; }

  else { p.classList.add("wait"); t.textContent="Round set — not open yet"; }

/* A playing-card face as inline SVG (no images, no CDN). kind "red"/"black" draws
   a red/black suited card (G6); a hex colour draws a plain number card (G5). */

function cardFace(rank, kind){
  const isRB=(kind==="red"||kind==="black");

  const suit=kind==="red"?"♥":kind==="black"?"♠":"";

  if(suit) s.append(svgEl("text",{x:9,y:33,fill:ink,"font-size":"12","font-family":"IBM Plex Mono"},suit));
  s.append(svgEl("text",{x:30,y:50,fill:ink,"font-size":"30","font-weight":"700","text-anchor":"middle","dominant-baseline":"central","font-family":"IBM Plex Mono"}, isRB?(suit||String(rank)):String(rank)));
  s.append(svgEl("text",{x:52,y:78,fill:ink,"font-size":"17","font-weight":"700","text-anchor":"end","font-family":"IBM Plex Mono"},String(rank)));

/* G6 — Red vs Black: pick partner (or a practice bot), take the colour opposite
   your partner's, then tap the card YOU played each hand. Writes incrementally so
   your partner watches it fill in live; stores the full sequence for the joint matrix. */
function studentRedBlack(c){
  const cf=cfg("redblack"), R=cf.rounds||20, cur=mySub();
  const dk="redblack-"+roundKey(control.activeGame,control.round), d=draftFor(dk);
  if(cur && d._loaded!==true){
    if(cur.color) d.color=cur.color; if(cur.partner) d.partner=cur.partner; if(cur.partnerName) d.partnerName=cur.partnerName; if(cur.bot) d.bot=true;
    if(cur.seq) d.seq=String(cur.seq).split(",").map(x=>{ x=x.trim(); return x===""?undefined:x; });
    d._loaded=true;
  }
  if(!Array.isArray(d.seq)) d.seq=[];
  d.seq.length=R;
  const saveNow=()=>schedulePairSave({color:d.color,partner:d.partner,partnerName:d.partnerName,seq:d.seq.map(x=>x==null?"":x).join(",")});
  c.append(Object.assign(el("h2"),{textContent:"Red vs Black",style:"font-size:1.4rem;margin:6px 0 4px"}));
  c.append(pairRules("How it was played",[
    "Two of you, one Red and one Black (coin toss). Cards: K, A(=1), 2 and 3.",
    "Each hand you both play one card at the same time.",
    "Red wins if BOTH play K, or both play number cards with DIFFERENT numbers.",
    "Black wins if exactly ONE plays K, or both play the SAME number.",
    "Pick your partner, take your colour, then tap the card YOU played each hand — we work out who won."]));
  const host=el("div"); host.style.marginTop="14px"; c.append(host);
  const paint=()=>{
    host.replaceChildren();
    host.append(partnerPicker(d, paint));
    if(!d.partner){ host.append(hintLine("Pick your partner (or the practice bot) to start.")); return; }
    // live partner sub + colour lock
    const psub = d.bot ? null : subs.find(s=> String(s.studentId)===String(d.partner));
    const linked = !!(psub && String(psub.partner)===String(myId));
    let locked=false;
    if(linked && psub.color){
      if(psub.color!==d.color){ d.color=oppColor(psub.color); locked=true; }
      else { if(String(myId) > String(psub.studentId)) d.color=oppColor(psub.color); locked=true; }  // conflict tiebreak by id
    }
    const cp=el("div","colorpick"); cp.append(tinyLabel("Your colour"));
    if(locked){ cp.append(Object.assign(el("div","note-box teal"),{innerHTML:"You're <b>"+(d.color==="red"?"Red ♥":"Black ♠")+"</b> — "+esc(psub.name)+" took "+(psub.color==="red"?"Red":"Black")+"."})); }
    else {
      const cprow=el("div","row"); cprow.style.gap="8px";
      [["red","Red ♥"],["black","Black ♠"]].forEach(([v,l])=>{ const b=el("button","colbtn"+(d.color===v?" sel "+v:"")); b.type="button"; b.textContent=l;
        b.onclick=()=>{ d.color=v; saveNow(); paint(); }; cprow.append(b); });
      cp.append(cprow);
      if(d.bot) cp.append(Object.assign(el("div","sm mut"),{textContent:"The bot takes the other colour.",style:"margin-top:4px"}));
    }
    host.append(cp);

/* Tap the number cards in stacking order to build a 4-permutation; ↺ resets.
   Calls onChange(arrayOfNums) — the caller repaints from its own draft state. */
function orderingPicker(current, onChange){
  const box=el("div","q-pick");
  const row=el("div","card-rail small");
  [1,2,3,4].forEach(n=>{
    const used=current.indexOf(n);

    b.onclick=()=>{ if(current.indexOf(n)>=0||current.length>=4) return; onChange(current.concat(n)); };
    row.append(b);
  });
  const reset=el("button","q-reset","↺"); reset.type="button"; reset.title="Clear"; reset.onclick=()=>onChange([]);
  row.append(reset);
  box.append(row); return box;
}

function revealNarr(g){
  if(g==="guess23") return "Where did the class land relative to pure rationality?";
  if(g==="pd") return "Did people keep the money for themselves or give it to their partner?";
  if(g==="coord") return "Without a word exchanged, did the class converge on the same answer?";
  if(g==="quatro") return "Which card orderings did the class favour, and did any win more?";
  if(g==="redblack") return "How did the class play each card — and does it match the equilibrium?";

function analyzeGuess(teacher,list){
  list=list||subs;
  const cf=cfg("guess23");
  const vals=list.map(s=>Number(s.value)).filter(v=>!isNaN(v)).sort((a,b)=>a-b);
  const n=vals.length, mean=vals.reduce((a,b)=>a+b,0)/n;
  const target=cf.frac*mean;
  const median = n%2?vals[(n-1)/2]:(vals[n/2-1]+vals[n/2])/2;
  let best=Infinity,winners=[]; list.forEach(s=>{const d=Math.abs(Number(s.value)-target); if(d<best-1e-9){best=d;winners=[s];}else if(Math.abs(d-best)<1e-9)winners.push(s);});
  const zeros=vals.filter(v=>v===0).length;
  const mine = !teacher ? mySub() : null;
  const myVal = mine && mine.value!=null ? Number(mine.value) : null;
  const iWon = myVal!=null && winners.some(w=>w.studentId===myId);
  const markers=[{x:target,l:"Target",strong:true}];
  if(myVal!=null) markers.push({x:myVal,l:"You ("+fmt(myVal,1)+")",col:"#3b6fe0",strong:true});
  const wrap=el("div","grid-analysis");
  const left=el("div","chart-card");
  left.append(Object.assign(el("h3"),{textContent:"Distribution of guesses"}),
    Object.assign(el("div","cap"),{textContent:"Each bar counts guesses in a 5-wide bin. The gold line marks the winning target"+(myVal!=null?"; the blue line is your guess.":".")}));
  left.append(histogram(vals,cf.min,cf.max,5,markers,target));
  left.append(levelLegend(myVal!=null));
  wrap.append(left);
  const right=el("div","stack");
  const st=el("div","stats");
  const tiles=[statTile("Class average",fmt(mean,1),"of all guesses"),
    statTile("Target",fmt(target,1),fmt(cf.frac*100,0)+"% of the mean · closest wins",true),
    statTile("Median",fmt(median,1)),
    statTile("Guessed 0",zeros+" ("+pct(zeros/n)+")","fully rational")];
  st.append(...tiles);
  right.append(st);
  const nb=el("div","note-box");
  const avgLevel = mean>0 ? Math.max(0, Math.log(mean/50)/Math.log(cf.frac)) : 5;
  nb.innerHTML="<b>Remark:</b> the only Nash equilibrium is everyone guessing 0. The class average of "+fmt(mean,1)+" implies roughly <b>"+fmt(avgLevel,1)+" levels</b> of iterated \"if they think, then I think…\" reasoning — real people stop a few steps short of full rationality (level-k thinking).";
  right.append(nb);
  wrap.append(right);
  const out=el("div","stack");
  out.append(guessWinnerCard(winners,target));
  if(myVal!=null) out.append(myGuessCard(myVal,target,iWon));
  out.append(wrap);
  return out;
}

/* Deterministic PRNG (xorshift) seeded from a string — same pairing on every device. */
function seededRand(seedStr){
  let s=5381; for(let i=0;i<seedStr.length;i++) s=((s<<5)+s+seedStr.charCodeAt(i))>>>0;
  if(s===0) s=1;
  return ()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; };
}
/* Randomly pair the round's submissions. Sorted by studentId first so the shuffle is
   identical for the instructor and every student; last player unpaired if odd. */
function pairSubs(list){
  const a=list.slice().sort((x,y)=> x.studentId<y.studentId?-1:x.studentId>y.studentId?1:0);
  const rand=seededRand("pair-"+(curKey||""));
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rand()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  const pairs=[]; for(let i=0;i<a.length;i+=2){ pairs.push([a[i], a[i+1]||null]); }
  return pairs;
}

/* G6 — Red vs Black: aggregate each colour's card-choice counts across all pairs, compare
   to the mixed Nash (K 40%, each number 20%; the structure favours Black 60/40). */
/* Parse a Red-vs-Black submission's tapped sequence into an array of card tokens. */
function rbSeq(s){ return (s&&s.seq)? String(s.seq).split(",").map(x=>x.trim()).filter(Boolean) : []; }
/* Deterministic winner of one Red-vs-Black hand — no ties. */
function redBlackWinner(rc,bc){
  if(rc==="K"&&bc==="K") return "red";
  if((rc==="K")!==(bc==="K")) return "black";   // exactly one K
  return rc===bc ? "black" : "red";             // both numbers: same→Black, different→Red
}
/* Render a 4×4 card-vs-card matrix (Red rows × Black cols) as a shaded heat table.
   F is a normalized fraction matrix (cells sum ~1); heat is scaled to its max cell. */
function jointMatrixCard(title, F, caption){
  const card=el("div","chart-card"); card.append(Object.assign(el("h3"),{textContent:title}));
  const L=["K","A","2","3"]; let mx=0; F.forEach(r=>r.forEach(v=>{ if(v>mx)mx=v; }));
  let html="<tr><th class='cn'>Red ↓ &nbsp; Black →</th>"+L.map(l=>"<th>"+l+"</th>").join("")+"</tr>";
  for(let i=0;i<4;i++){ html+="<tr><th class='rh'>"+L[i]+"</th>";
    for(let j=0;j<4;j++){ const v=F[i][j], a=mx?Math.round(v/mx*82):0;
      html+="<td style='background:color-mix(in srgb, var(--accent) "+a+"%, transparent)'>"+(Math.round(v*1000)/10)+"%</td>"; }
    html+="</tr>"; }
  const t=el("table","jmx"); t.innerHTML=html;
  const sc=el("div","tablescroll"); sc.append(t); card.append(sc);
  if(caption) card.append(Object.assign(el("div","cap"),{textContent:caption}));
  return card;
}
/* Compact "who played whom" list for the matched pairs (instructor-facing). */
function pairingsCard(pairs, fmtPair){
  const card=el("div","chart-card"); card.append(Object.assign(el("h3"),{textContent:"Who played whom ("+pairs.length+" pairs)"}));
  if(!pairs.length){ card.append(Object.assign(el("div","cap"),{textContent:"No complete pairs yet — both partners must submit."})); return card; }
  let html="<tr><th>#</th><th style='text-align:left'>Pair</th></tr>";

  const t=el("table","matrix"); t.style.fontSize=".84rem"; t.innerHTML=html;
  const sc=el("div","tablescroll"); sc.style.marginTop="8px"; sc.append(t); card.append(sc); return card;
}
/* Group submissions into mutually-pointing pairs (each names the other as partner).
   Returns [[a,b],…]; each sub appears in at most one pair. */
function mutualPairs(list){
  const byId={}; list.forEach(s=>{ byId[String(s.studentId)]=s; });
  const seen={}, pairs=[];
  list.forEach(a=>{ const b=byId[String(a.partner)];
    if(b && b!==a && String(b.partner)===String(a.studentId)){
      const key=[String(a.studentId),String(b.studentId)].sort().join("|"); if(seen[key])return; seen[key]=1;
      pairs.push([a,b]); } });
  return pairs;
}
function analyzeRedBlack(list){

  const RM=marg(reds), BM=marg(blacks);

  } else {

      Object.assign(el("div","cap"),{textContent:"Waiting for complete pairs — both partners in a pair must submit before the joint matrix can be built."})); jrow.append(ph);
  }
  const ideal=nash.map(pi=>nash.map(pj=>pi*pj));

    statTile("Nash win split","Red 40% · Black 60%","the structure favours Black","gold"),

  nb.innerHTML="<b>Teaching point.</b> A zero-sum game with a <b>mixed-strategy equilibrium</b>: play <b>K 40%</b> and each number 20%. Even played perfectly, <b>Black wins ~60%</b>, so the colour coin-toss isn't a fair start. The two matrices are the real lesson: marginals alone can't show it, but the <b>joint</b> distribution reveals whether the class actually mixed independently (like the equilibrium on the right) or <b>best-responded</b> and correlated their cards.";
  wrap.append(nb);

/* Quatro Uno win outcome for a pile matchup (both piles top→bottom, arrays of 1..4). */
function quatroPlay(a,b){
  a=a.slice(); b=b.slice();
  let guard=0;
  while(a.length&&b.length&&guard++<50){
    const x=a[0], y=b[0];
    const bothOut = x===y || (x===1&&y===4) || (x===4&&y===1);
    if(bothOut){ a.shift(); b.shift(); }
    else if(x>y){ b.shift(); } else { a.shift(); }
  }
  if(!a.length&&!b.length) return "tie";
  return a.length? "me":"them";   // "me" = first pile (a) survives
}
/* G5 — Quatro Uno: ordering popularity + win rate, from mutually-paired piles.
   Winners are computed by quatroPlay (never entered), so there is nothing to "check". */
function analyzeQuatro(list){
  list=list.filter(isDone);
  const qp=s=>{ try{ return JSON.parse(s.piles||"[]").map(String); }catch(e){ return []; } };
  const orders={};
  list.forEach(s=> qp(s).forEach(o=>{ if(o.length===4) orders[o]=(orders[o]||0)+1; }));
  const pairs=mutualPairs(list);
  const winByOrder={}; let rounds=0, ties=0;
  pairs.forEach(([a,b])=>{ const ap=qp(a), bp=qp(b), L=Math.min(ap.length,bp.length);
    for(let i=0;i<L;i++){ const A=ap[i], B=bp[i]; if(A.length!==4||B.length!==4) continue; rounds++;
      const res=quatroPlay(A.split("").map(Number), B.split("").map(Number));
      const cred=(ord,won)=>{ const w=winByOrder[ord]||(winByOrder[ord]={g:0,w:0}); w.g++; if(won)w.w++; };
      if(res==="tie"){ ties++; cred(A,false); cred(B,false); }
      else if(res==="me"){ cred(A,true); cred(B,false); }
      else { cred(A,false); cred(B,true); } } });
  const wrap=el("div","stack");
  const top=Object.entries(orders).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const left=el("div","chart-card");
  left.append(Object.assign(el("h3"),{textContent:"Most-chosen pile orderings"}),
    Object.assign(el("div","cap"),{textContent:"Across all players' piles ("+Object.values(orders).reduce((a,n)=>a+n,0)+" piles). Leftmost digit is the top card."}));
  left.append(barChart(top.map(([o,n])=>({label:o,value:n,color:"var(--accent)"})), Math.max(1,...top.map(t=>t[1])), false, ""));
  wrap.append(left);
  const st=el("div","stats");
  const winRows=Object.entries(winByOrder).filter(([o,w])=>w.g>=3).sort((a,b)=>(b[1].w/b[1].g)-(a[1].w/a[1].g));
  const best=winRows[0], worst=winRows[winRows.length-1];
  st.append(statTile("Best ordering",best?best[0]:"—",best?("won "+pct(best[1].w/best[1].g)+" of "+best[1].g+" hands"):"need ≥3 hands","good"),
    statTile("Weakest ordering",worst&&worst!==best?worst[0]:"—",worst&&worst!==best?("won "+pct(worst[1].w/worst[1].g)+" of "+worst[1].g):"need more data","bad"),
    statTile("Hands scored",String(rounds),pairs.length+" complete pairs · "+pct(rounds?ties/rounds:0)+" ties",true));
  wrap.append(st);
  const nb=el("div","note-box");
  nb.innerHTML="<b>Teaching point.</b> The “1 beats 4” twist makes Quatro Uno <b>non-transitive</b> — like rock-paper-scissors, no single ordering dominates, so the equilibrium is to <b>mix</b>. If the class clustered on one “obvious” pile, a counter-ordering beats it — watch the win-rates flip as different orderings meet.";
  wrap.append(nb);
  if(pairs.length) wrap.append(pairingsCard(pairs, ([a,b])=> (a.name||"?")+" ↔ "+(b.name||"?")));
  return wrap;
}
function analyzePG(list){
  list=list||subs;
  const cf=cfg("publicgoods");
  const contribs=list.map(s=>Number(s.contrib)).filter(v=>!isNaN(v));
  const n=contribs.length, total=contribs.reduce((a,b)=>a+b,0), avg=total/n;
  // Slide model: the whole pot is multiplied by M and split equally among the N players,
  // so each player receives M·total/N — your own share of a contributed mark is only M/N.
  const M=cf.mult, boosted=M*total, perHead=n?boosted/n:0;   // each player's share of the boosted pot
  const freeRiders=contribs.filter(v=>v===0).length, fullCoop=contribs.filter(v=>v===cf.E).length;
  const groupEarnings=contribs.reduce((a,c)=>a+(cf.E-c)+perHead,0);
  const maxEarnings=n*(M*cf.E);   // everyone gives everything → each gets M·E
  const nashEarnings=n*cf.E;      // everyone keeps → each gets E
  const efficiency=maxEarnings>nashEarnings?(groupEarnings-nashEarnings)/(maxEarnings-nashEarnings):0;
  const perMark=n?M/n:M;          // private return per contributed mark
  const wrap=el("div","grid-analysis");
  const left=el("div","chart-card");
  left.append(Object.assign(el("h3"),{textContent:"How much each person contributed"}),
    Object.assign(el("div","cap"),{textContent:"Bins across the 0–"+cf.E+" mark range. Left pile = free-riders, right pile = full contributors."}));
  left.append(histogram(contribs,0,cf.E,Math.max(1,Math.round(cf.E/8)),[{x:avg,l:"Avg "+fmt(avg,1),strong:true}],avg));
  const bar=el("div"); bar.style.marginTop="18px";
  bar.append(Object.assign(el("h3"),{textContent:"Average earnings per player vs the two benchmarks",style:"font-size:.95rem;margin-bottom:8px"}));
  bar.append(barChart([
    {label:"Nash (all keep)",value:Math.round(nashEarnings/n*10)/10,color:"var(--bad)"},
    {label:"This class",value:Math.round(groupEarnings/n*10)/10,color:"var(--accent)"},
    {label:"Social optimum",value:Math.round(maxEarnings/n*10)/10,color:"var(--good)"}
  ], maxEarnings/n, false, " mk"));
  left.append(bar);
  wrap.append(left);
  const right=el("div","stack");
  const st=el("div","stats");
  st.append(statTile("Avg contribution",fmt(avg,1)+" / "+cf.E,pct(avg/cf.E)+" of your marks",true),
    statTile("Group efficiency",pct(efficiency),"of gains captured","good"),
    statTile("Free-riders",freeRiders,"contributed 0","bad"),
    statTile("Full contributors",fullCoop,"gave everything","good"));
  right.append(st);
  const nb=el("div","note-box");
  nb.innerHTML="<b>Teaching point:</b> each mark you keep is worth 1 to you; each mark you contribute comes back to you as only <b>"+fmt(perMark,2)+"</b> (the pot is ×"+M+", then split among "+n+") — so the private incentive is to give nothing (Nash). Yet every contributed mark creates <b>"+fmt(M,1)+"</b> marks for the group, so the group optimum is for everyone to give everything. In a bigger class your own share shrinks (M÷N), making free-riding even more tempting. The class captured <b>"+pct(efficiency)+"</b> of the possible surplus — the gap is the cost of free-riding.";
  right.append(nb);
  const nb2=el("div","note-box teal");
  nb2.innerHTML="Pot: <b>"+fmt(total,0)+"</b> marks → ×"+M+" = <b>"+fmt(boosted,0)+"</b>, split among "+n+" → each gets <b>"+fmt(perHead,1)+"</b> back. Everyone-gives would pay each "+fmt(M*cf.E,1)+" ("+M+"×"+cf.E+").";
  right.append(nb2);
  wrap.append(right);
  return wrap;
}

  });

function histogram(values,min,max,binW,markers,meanLine){
  const bins=[]; const nb=Math.ceil((max-min)/binW)+1;
  for(let i=0;i<nb;i++)bins.push(0);
  values.forEach(v=>{ let idx=Math.floor((v-min)/binW); if(idx<0)idx=0; if(idx>=nb)idx=nb-1; bins[idx]++; });
  const maxC=Math.max(...bins,1);
  const W=540,H=230, padL=34,padR=14,padT=18,padB=42, iw=W-padL-padR, ih=H-padT-padB;
  const svg=svgEl("svg",{viewBox:`0 0 ${W} ${H}`,role:"img"});
  for(let g=0;g<=maxC;g+=Math.max(1,Math.ceil(maxC/4))){
    const y=padT+ih-(g/maxC)*ih;
    svg.append(svgEl("line",{x1:padL,y1:y,x2:W-padR,y2:y,stroke:"var(--line-2)","stroke-width":1}));
    svg.append(svgEl("text",{x:padL-6,y:y+3,"text-anchor":"end",fill:"var(--faint)","font-size":"10","font-family":"IBM Plex Mono"},g));
  }
  const bw=iw/nb;
  bins.forEach((c,i)=>{
    const x=padL+i*bw, h=(c/maxC)*ih, y=padT+ih-h;
    svg.append(svgEl("rect",{x:x+1.5,y,width:Math.max(0,bw-3),height:h,rx:3,fill:"var(--accent)","fill-opacity":c?0.82:0}));
    if(c) svg.append(svgEl("text",{x:x+bw/2,y:y-4,"text-anchor":"middle",fill:"var(--muted)","font-size":"10","font-family":"IBM Plex Mono"},c));
  });
  const rng=(max-min)||1, rough=rng/6, mag=Math.pow(10,Math.floor(Math.log10(rough)));
  const tickStep=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=rough)||10*mag;
  for(let v=Math.ceil(min/tickStep)*tickStep; v<=max+1e-9; v+=tickStep){
    const x=padL+((v-min)/rng)*iw;
    svg.append(svgEl("line",{x1:x,y1:padT+ih,x2:x,y2:padT+ih+4,stroke:"var(--line)","stroke-width":1}));
    svg.append(svgEl("text",{x,y:H-padB+16,"text-anchor":"middle",fill:"var(--muted)","font-size":"11","font-family":"IBM Plex Mono"},(Math.round(v*10)/10)));
  }
  svg.append(svgEl("line",{x1:padL,y1:padT+ih,x2:W-padR,y2:padT+ih,stroke:"var(--line)","stroke-width":1.5}));
  (markers||[]).forEach(m=>{
    if(m.x<min||m.x>max) return;
    const x=padL+((m.x-min)/(max-min||1))*iw;
    const col=m.col||(m.strong?"var(--gold)":"var(--faint)");
    svg.append(svgEl("line",{x1:x,y1:padT-6,x2:x,y2:padT+ih,stroke:col,"stroke-width":m.strong?2:1.2,"stroke-dasharray":m.strong?"":"3 3"}));
    svg.append(svgEl("text",{x:Math.min(Math.max(x,padL+2),W-padR-2),y:padT-9,"text-anchor":"middle",fill:col,"font-size":"10","font-weight":m.strong?"700":"500","font-family":"IBM Plex Sans"},m.l));
  });

}
function svgEl(tag,attrs,text){

function openInstructorGate(){
  const app=$("#app");
  // Allowlisted Google instructors skip the passcode entirely.
  if(authUser && isInstructorEmail(authUser.email)){ becomeTeacher(); return; }
  // Lockdown mode: instructor access is Google-allowlist only, no passcode.
  if(REQUIRE_GOOGLE){
    const wrap=el("div","setup-wrap"); const card=el("div","card stage");
    card.append(el("div","eyebrow","Instructor access"),
      Object.assign(el("h2"),{textContent:"Sign in as an instructor",style:"font-size:1.5rem;margin:6px 0 6px"}));
    card.append(el("p","lead", authUser
      ? "The account "+(authUser.email||"you're signed in with")+" isn't on the instructor list. Sign in with an instructor Google account, or ask to be added."
      : "Sign in with your instructor Google account to open the console."));
    const row=el("div","stack"); row.style.marginTop="16px"; row.style.maxWidth="320px";
    if(fbAuth){ const gb=el("button","gbtn"); gb.textContent="Continue with Google"; gb.onclick=googleSignIn; row.append(gb); }
    if(authUser){ const so=el("button","ghost-btn","Sign out"); so.onclick=async()=>{ await signOutStudent(); }; row.append(so); }
    const cancel=el("button","btn neutral","Cancel"); cancel.onclick=render; row.append(cancel);
    card.append(row); wrap.append(card); app.replaceChildren(wrap); return;
  }
  const wrap=el("div","setup-wrap");
  const card=el("div","card stage");
  const hasPass = !!(control && control.passHash);
  const controlExists = !!control;
  card.append(el("div","eyebrow","Instructor access"),
    Object.assign(el("h2"),{textContent: hasPass?"Enter instructor passcode":controlExists?"Set an instructor passcode":"Set up this classroom session",style:"font-size:1.5rem;margin:6px 0 6px"}));
  card.append(el("p","lead", hasPass?"Enter the passcode you chose when you created this session.":controlExists?"This room has no instructor passcode yet. Choose one to take control — the current round stays exactly as it is.":"You're the first here. Choose a passcode — you'll re-enter it to run the console. Students never need it."));
  const f=el("div","field"); f.style.marginTop="16px"; f.style.maxWidth="300px";
  const inp=el("input","input"); inp.type="password"; inp.placeholder="Passcode"; inp.autofocus=true;
  f.append(inp);
  const row=el("div","row"); row.style.marginTop="16px";
  const b=el("button","btn", hasPass?"Unlock console":controlExists?"Set passcode":"Create session");
  const cancel=el("button","btn neutral","Cancel"); cancel.onclick=render;
  row.append(b,cancel);
  const err=el("div","sm"); err.style.color="var(--bad)"; err.style.marginTop="10px";
  const go=async()=>{
    const code=inp.value.trim(); if(!code){inp.focus();return;}
    // Re-read live state at click time — control may have loaded since the gate opened.
    if(control && control.passHash){
      if(hash(code)===control.passHash){ becomeTeacher(); }
      else { err.textContent="Incorrect passcode."; inp.value=""; inp.focus(); }
      return;
    }
    // No passcode set yet. Don't guess at DB state until we've heard from the server —
    // otherwise a click during load could create a fresh room and wipe a live round.
    if(!controlLoaded){ err.textContent="Still connecting to the room — wait a second and try again."; return; }
    b.disabled=true; err.textContent="";
    // If a room already exists, only add the passcode; never reset the active game/round/phase.
    const patch = control
      ? { passHash:hash(code) }
      // Don't bake DEFAULT_CONFIG into the room — let cfg() fall back to the live code
      // defaults, so changing a default (e.g. the guess fraction) takes effect for new rooms.
      : { passHash:hash(code), config:{}, activeGame:null, round:1, phase:"waiting" };
    const ok = await writeControl(patch);
    b.disabled=false;
    if(ok){ becomeTeacher(); }
    else { err.textContent="Couldn't save the passcode — check your connection and try again."; }
  };
  b.onclick=go; inp.onkeydown=e=>{if(e.key==="Enter")go();};
  card.append(f,row,err); wrap.append(card); app.replaceChildren(wrap);
}

/* Inline SVG QR of a URL (uses the bundled qrcode-generator). Cached by URL so the
   full-screen view doesn't regenerate it on every live count tick. Always black-on-white
   regardless of theme, so scanners work. */
let _qrCache={url:null,svg:null};
function qrSVG(text){
  try{
    const qr=qrcode(0,"M"); qr.addData(String(text)); qr.make();
    const n=qr.getModuleCount(), quiet=4, total=n+quiet*2; let rects="";
    for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(qr.isDark(r,c)) rects+='<rect x="'+(c+quiet)+'" y="'+(r+quiet)+'" width="1.04" height="1.04"/>';
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+total+' '+total+'" shape-rendering="crispEdges" role="img" aria-label="QR code to join the class">'
      +'<rect width="'+total+'" height="'+total+'" fill="#fff"/><g fill="#000">'+rects+'</g></svg>';
  }catch(e){ return null; }
}
function qrFor(url){ if(_qrCache.url!==url){ _qrCache={url, svg:qrSVG(url)}; } return _qrCache.svg; }
